<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sarah's Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Sarah's Sim shell paint (bible, Art, Palette: shell body #f6c9c1, #e9a7a2, #c9827f; the approved mockups' shell). */
:root{--page:#2a1b24;--shell:#e9a7a2;--shell-hi:#f6c9c1;--shell-lo:#c9827f;--bezel:#3b2430;--bezel-edge:#55313f;--brand-ink:#e8b8b0;--led:#ffd56b;--led-off:#5a3b46;
--scr-bg:#22171f;--scr-fg:#fff1e2;--scr-hi:#ffd56b;--btn:#fff1e2;--label:#8e5a5e;--btn-a:#e46f8b;--btn-b:#7fa7a0;--btn-ink:#fff;
--px:"Press Start 2P",ui-monospace,Menlo,monospace;--vt:"VT323",ui-monospace,Menlo,monospace;color-scheme:dark}
body{margin:0}
</style>
<style>/* ../../../engine/shell.css */
/* Studio shell: the GBA-style handheld every game plays inside (studio-bible/controls.md, Shell and Buttons).
   Layout, button sizes and the size steps are shared; each game paints it by setting these on :root:
     --page (behind the shell)  --shell --shell-hi --shell-lo (body)  --bezel --bezel-edge (screen surround)
     --brand-ink (brand strip text)  --led --led-off  --scr-bg --scr-fg --scr-hi (screen, focus ring)
     --btn --label (D-pad, L/R shoulders, Select/Start)  --btn-a --btn-b --btn-ink (A and B)  --px --vt (fonts)
   The markup comes from engine/shell.js. Loaded by each game's index.html, before the game's own styles,
   and inlined by the game's build, so dist/index.html stays one file. */
html,body{height:100%}
body{background:var(--page);color:var(--scr-fg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{height:100%;display:flex;justify-content:center;box-sizing:border-box;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-block:4px}
.shell{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;padding:6px 12px 10px;border-radius:16px 16px 34px 34px;
  background:linear-gradient(170deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.5)}
/* L and R are wide shoulder buttons in the top corners of the controls, right under the screen (spec 003, Nov 21, 2026).
   The row tucks into the shell's gap above the controls (negative margin), so the screen loses only the buttons' height. */
.shoulders{flex:none;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:-6px}
.mid{display:flex;flex-direction:column;align-items:center;gap:var(--midgap)}
.sh{width:var(--shw);height:var(--shh);border:0;border-radius:5px;background:var(--btn);color:var(--label);font:9px var(--px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.sh.l{border-top-left-radius:12px}.sh.r{border-top-right-radius:12px}
.bezel{flex:1;min-height:0;background:var(--bezel);border-radius:10px 10px 26px 10px;padding:10px 10px 6px;display:flex;flex-direction:column;gap:5px;box-shadow:inset 0 0 0 2px var(--bezel-edge)}
.brand{display:flex;justify-content:space-between;align-items:center;font:7px var(--px);color:var(--brand-ink);letter-spacing:.08em}
.led{width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led);display:inline-block;margin-right:6px;vertical-align:middle}
.led.off{background:var(--led-off);box-shadow:none}
.screen{flex:1;min-height:0;position:relative;background:var(--scr-bg);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;font:20px/1.05 var(--vt);transition:filter .4s}
.ctrls{flex:none;display:grid;grid-template-columns:auto auto auto;justify-content:space-between;align-items:center;gap:6px;padding:4px 0 0}
.dpad{display:grid;grid-template-columns:repeat(3,var(--pad));grid-template-rows:repeat(3,var(--pad))}
.dpad button{border:0;background:var(--btn);color:var(--label);font:10px var(--px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.45)}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.dpad .c{grid-area:2/2;background:var(--btn);pointer-events:none;box-shadow:none}
.ab{position:relative;width:calc(var(--ab)*2.15);height:calc(var(--ab)*1.85)}
.ab button{position:absolute;width:var(--ab);height:var(--ab);border-radius:50%;border:0;color:var(--btn-ink);font:13px var(--px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),0 3px 0 rgba(0,0,0,.35)}
.ab .a{right:0;top:6px;background:var(--btn-a)}
.ab .b{left:0;top:calc(var(--ab)*.82);background:var(--btn-b)}
.ss{display:flex;gap:8px;align-items:flex-start}
.ss>div{width:var(--pill);display:flex;flex-direction:column;align-items:center}
.ss button{width:calc(var(--pill) - 4px);height:14px;border-radius:9px;border:0;background:var(--btn);box-shadow:inset 0 -2px 0 rgba(0,0,0,.45);transform:rotate(-22deg)}
.ss span{display:block;font:6px var(--px);color:var(--label);margin-top:10px;text-align:center}  /* the tilted pill reaches about 8 px below its box; 10 px keeps the label clear (bug, Nov 21) */
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,button.down{filter:brightness(1.35);transform:translateY(1px)}
.ss button:active{transform:rotate(-22deg) translateY(1px)}
button:focus-visible{outline:2px solid var(--scr-hi);outline-offset:2px}
:root{--pad:42px;--ab:54px;--pill:46px;--midgap:16px;--shw:80px;--shh:24px}
@media (max-height:700px),(max-width:380px){:root{--pad:38px;--ab:48px;--pill:42px;--midgap:12px}.bezel{padding:7px 7px 5px}}
@media (max-height:560px),(max-width:340px){:root{--pad:34px;--ab:42px;--pill:40px;--midgap:9px}.brand{display:none}}
@media (max-height:480px){:root{--pad:30px;--ab:38px;--pill:38px;--midgap:7px;--shw:72px;--shh:22px}}

</style>
<style>
/* iPhone safe area: keep the shell's top (the title bar) below the clock and battery, and its bottom above the home bar.
   --safe-top and --safe-bottom only exist so the check can stand in for a notched phone. */
.wrap{padding-top:max(4px,var(--safe-top,env(safe-area-inset-top,0px)));padding-bottom:max(4px,var(--safe-bottom,env(safe-area-inset-bottom,0px)))}
#cv{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
</style>
</head><body>
<div class="screen" id="screen" data-brand="SARAH'S SIM" data-brand-sub="FOR SARAH" data-shoulders="off"
  data-label-select="Select: turn" data-label-start="Start: menu">
  <canvas id="cv" aria-label="Sarah's Sim"></canvas>
</div>
<script>/* ../../../engine/shell.js */
// Studio shell: builds the GBA-style handheld around a game's screen (studio-bible/controls.md, Shell and Buttons).
// Shared by every game; the look comes from engine/shell.css and the game's own colors.
//
// The game's index.html holds only its screen, marked with the brand text and its own button labels:
//   <div class="screen" id="screen" data-brand="BLACK LANTERN" data-brand-sub="DOT MATRIX"
//        data-label-start="Start: menu">...</div>
//   <script src="../../../engine/shell.js"><\/script>   (first script, before any game code)
// Optional labels (spoken by screen readers): data-label-l, -r, -start, -select, -a, -b.
// data-shoulders="off" leaves out the L and R row, for a game whose bible drops them (Sarah's Sim, Nov 25, 2026);
// the screen gets that space. engine/input.js skips buttons that aren't there.
//
// It wraps the screen in the bezel with the brand strip and the LED (#led), then the shoulder row with
// L top left and R top right (#bL #bR, spec 003), then the controls row: D-pad ([data-pad]),
// Select and Start (#bSel #bStart), and A and B (#bA #bB).
// engine/input.js makes the buttons work.
(function () {
  var screen = document.getElementById('screen');
  if (!screen) throw new Error('shell.js: no #screen element');
  var d = screen.dataset;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var lab = function (k, def) { return esc(d['label' + k] || def); };

  var wrap = document.createElement('div');
  wrap.className = 'wrap';
  // Same markup, spacing included, as the hand-copied shell it replaced (Nov 21, 2026), apart from L and R,
  // which moved from the middle cluster into their own shoulder row under the screen (spec 003, Nov 21).
  wrap.innerHTML =
    '\n  <div class="shell">\n    <div class="bezel">\n' +
    '      <div class="brand"><span><span class="led" id="led"></span>' + esc(d.brand || '') + '</span><span>' + esc(d.brandSub || '') + '</span></div>\n' +
    '      <i data-screen></i>\n    </div>\n' +
    (d.shoulders === 'off' ? '' :
    '    <div class="shoulders">\n' +
    '      <button class="sh l" id="bL" aria-label="' + lab('L', 'L: previous') + '">L</button>\n' +
    '      <button class="sh r" id="bR" aria-label="' + lab('R', 'R: next') + '">R</button>\n' +
    '    </div>\n') +
    '    <div class="ctrls">\n' +
    '      <div class="dpad">\n' +
    '        <button class="u" data-pad="up" aria-label="Up">▲</button>\n' +
    '        <button class="l" data-pad="left" aria-label="Left">◀</button>\n' +
    '        <span class="c"></span>\n' +
    '        <button class="r" data-pad="right" aria-label="Right">▶</button>\n' +
    '        <button class="d" data-pad="down" aria-label="Down">▼</button>\n' +
    '      </div>\n' +
    '      <div class="mid">\n' +
    '        <div class="ss">\n' +
    '          <div><button id="bSel" aria-label="' + lab('Select', 'Select') + '"></button><span>SELECT</span></div>\n' +
    '          <div><button id="bStart" aria-label="' + lab('Start', 'Start: menu') + '"></button><span>START</span></div>\n' +
    '        </div>\n' +
    '      </div>\n' +
    '      <div class="ab">\n' +
    '        <button class="a" id="bA" aria-label="' + lab('A', 'A: confirm') + '">A</button>\n' +
    '        <button class="b" id="bB" aria-label="' + lab('B', 'B: back') + '">B</button>\n' +
    '      </div>\n' +
    '    </div>\n  </div>\n';
  screen.parentNode.insertBefore(wrap, screen);
  var slot = wrap.querySelector('[data-screen]');
  slot.parentNode.replaceChild(screen, slot);
})();

</script>
<script>/* ../../../engine/studio.js */
// Studio link: the small piece every game shares with the launcher.
// Tells a game which build it is (Dev or Release), which save prefix to use,
// and reads the launcher's shared settings. Plain script, no framework.
// A game loads it before its own code: <script src="../../../engine/studio.js"><\/script>
(function () {
  var path = location.pathname;
  // Dev builds live under /dev/<game>/ on the site; everything else is Release.
  var channel = /\/dev\/[^/]+\/?(index\.html)?$/.test(path) ? 'dev' : 'release';
  var params = new URLSearchParams(location.search);

  var shelfUrl = channel === 'dev' ? '../../' : '../';
  // True when this game was opened from the game shelf (now, or earlier in this tab), so a game only offers
  // "back to the shelf" where there is one. A copy played elsewhere (the Black Lantern Intake page, a check
  // opening the file directly) has no shelf to go back to.
  var fromShelf = false;
  try {
    var shelf = new URL(shelfUrl, location.href).href;
    fromShelf = document.referrer.split(/[?#]/)[0].replace(/index\.html$/, '') === shelf || sessionStorage.getItem('studio.fromShelf') === shelf;
    if (fromShelf) sessionStorage.setItem('studio.fromShelf', shelf);
  } catch (e) {}

  window.Studio = {
    channel: channel,
    fromShelf: fromShelf,
    // True when the launcher's Continue button opened the game.
    continued: params.get('continue') === '1',
    // Dev builds keep their own saves, so testing never touches the stable one.
    // savePrefix('bl.') -> 'bl.' on Release, 'dev.bl.' on Dev.
    savePrefix: function (base) { return channel === 'dev' ? 'dev.' + base : base; },
    // Shared settings set in the launcher. Games read them and never keep their own copy.
    settings: function () {
      try { return JSON.parse(localStorage.getItem('studio.settings') || '{}'); } catch (e) { return {}; }
    },
    // Back to the game shelf. The launcher sits at the site root, one level up
    // from a Release game and two from a Dev game.
    shelfUrl: shelfUrl,
    toShelf: function () { location.href = window.Studio.shelfUrl; }
  };
})();

</script>
<script>/* ../../../engine/input.js */
// Studio input: the shell's buttons and the test keyboard, for every game (studio-bible/controls.md, Buttons and Keyboard).
// Needs the buttons from engine/shell.js. Knows nothing about any game: the game says where presses go.
//
//   StudioInput.start({
//     press(kind),       // every press: 'up' 'down' 'left' 'right' 'a' 'b' 'l' 'r' 'start' 'select'.
//                        // The game routes it (for example to the map while it's up, otherwise to the menus).
//     walking(),         // true while held directions should walk (the map is up)
//     hold(dir, on),     // a direction went down (on) or up while walking; also told to let go on lift and blur
//   });
//
// D-pad buttons fire once on press, then repeat after 320 ms every 85 ms (menus). While walking() the
// direction also counts as held until the finger lifts, slides off or the touch is cancelled.
// A, B, L, R, Start and Select fire on tap. Keys are ignored while a text field has focus, and Enter or
// Escape there only closes the phone keyboard. Leaving the window lets go of every direction.
// Later (Running, hold B): add an "is this button held?" query here so every game shares it.
(function () {
  var DIRS = ['up', 'down', 'left', 'right'];
  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    z: 'a', Z: 'a', ' ': 'a', x: 'b', X: 'b', q: 'l', Q: 'l', w: 'r', W: 'r',
    Enter: 'start', Backspace: 'select', Shift: 'select'   // Backspace = Select, Shift a second Select (controls.md, Nov 21)
  };
  var REPEAT_AFTER = 320, REPEAT_EVERY = 85;
  var typing = function () { var el = document.activeElement; return !!(el && el.tagName === 'INPUT'); };

  function start(o) {
    var press = o.press, walking = o.walking || function () { return false; }, hold = o.hold || function () {};
    var $ = function (s) { return document.querySelector(s); };

    // D-pad with hold-repeat
    document.querySelectorAll('[data-pad]').forEach(function (b) {
      var t1, t2, d = b.dataset.pad;
      var stop = function () { clearTimeout(t1); clearInterval(t2); b.classList.remove('down'); if (walking()) hold(d, false); };
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (typing()) document.activeElement.blur();
        b.classList.add('down');
        if (walking()) hold(d, true);
        press(d);
        t1 = setTimeout(function () { t2 = setInterval(function () { press(d); }, REPEAT_EVERY); }, REPEAT_AFTER);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, stop); });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });

    // A, B, L, R, Start, Select: on tap
    [['#bA', 'a'], ['#bB', 'b'], ['#bL', 'l'], ['#bR', 'r'], ['#bStart', 'start'], ['#bSel', 'select']].forEach(function (p) {
      var el = $(p[0]); if (el) el.addEventListener('click', function () { press(p[1]); });   // L and R may be left out (shell.js)
    });

    // Keyboard, for testing on a computer
    document.addEventListener('keydown', function (e) {
      if (typing()) {
        // Enter (the phone keyboard's Go) or Escape only closes the keyboard; it must not also count as Start
        // (a game's own field handler can claim the key first with preventDefault)
        if (!e.defaultPrevented && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); document.activeElement.blur(); }
        return;
      }
      var k = KEYS[e.key]; if (!k) return;
      e.preventDefault();
      if (walking() && DIRS.indexOf(k) >= 0) { if (e.repeat) return; hold(k, true); }
      press(k);
    });
    document.addEventListener('keyup', function (e) { var k = KEYS[e.key]; if (k && DIRS.indexOf(k) >= 0) hold(k, false); });
    window.addEventListener('blur', function () { DIRS.forEach(function (d) { hold(d, false); }); });
  }

  window.StudioInput = { start: start, KEYS: KEYS };
})();

</script>
<script>/* ../../../engine/move.js */
// Studio movement: grid walking on the map, the camera and the canvas fit, for every game
// (studio-bible/controls.md: Shell, and "on the map, the last direction pressed wins"; art-style.md: 16 px tiles).
// Knows nothing about any game. The game keeps its own state object and passes it in, so what a save
// holds (map, x, y, dir) doesn't change. The state's fields:
//   x, y      tile the lead stands on        px, py   pixel position (moves during a step)
//   dir       'up' 'down' 'left' 'right'     mv       the step in progress, or null
//   anim      frames walked, for the walk cycle
//
//   StudioMove.place(s, x, y, dir)           put the lead on a tile, standing still
//   StudioMove.update(s, dir, {passable(x, y), busy(), arrive()})
//                                            once per screen frame while the map is up. dir is the held
//                                            direction (StudioMove.last(held)) or null. arrive() runs on
//                                            reaching a tile (warps, step triggers).
//   StudioMove.hold(held, dir, on)           returns the new held list; the last one pressed wins
//   StudioMove.ahead(s)                      [x, y] of the tile the lead faces (A uses it)
//   StudioMove.walkFrame(s)                  0 standing, 1 or 2 walking
//   StudioMove.camera(s, mapW, mapH, vw, vh) [x, y]: follows the lead, stops at the map's edges, centers small maps
//   StudioMove.nearestOpen(x, y, w, h, open)  [x, y] of the nearest tile (steps on the grid, through walls) where
//                                            open(x, y) is true, or null: a saved spot that's now a wall moves here
//   StudioMove.fit(box, canvas, maxH)        sizes the canvas 240 px wide and as tall as the box's shape allows
//                                            (130 to 320, or to maxH for a game whose bible lifts the cap), crisp
//                                            pixels; returns {w, h, boxW, boxH}, or null while hidden
(function () {
  var TILE = 16, STEPF = 10, WALKF = 5;   // a step takes 10 frames (about 6 tiles a second at 60 Hz); frames change every 5
  var VIEW_W = 240, VIEW_MIN_H = 130, VIEW_MAX_H = 320;
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  function place(s, x, y, dir) { s.x = x; s.y = y; s.dir = dir || 'down'; s.px = x * TILE; s.py = y * TILE; s.mv = null; }

  function update(s, dir, o) {
    var mv = s.mv;
    if (mv) {
      mv.t++;
      var k = mv.t / STEPF;
      s.px = Math.round((mv.fx + (mv.tx - mv.fx) * k) * TILE);
      s.py = Math.round((mv.fy + (mv.ty - mv.fy) * k) * TILE);
      s.anim = (s.anim || 0) + 1;
      if (mv.t >= STEPF) { s.x = mv.tx; s.y = mv.ty; s.mv = null; o.arrive(); }
      return;
    }
    if (o.busy() || !dir) return;
    // blocked: turn to face it without moving
    s.dir = dir;
    var d = DIRS[dir], nx = s.x + d[0], ny = s.y + d[1];
    if (o.passable(nx, ny)) s.mv = { fx: s.x, fy: s.y, tx: nx, ty: ny, t: 0 };
  }

  function hold(held, dir, on) { held = held.filter(function (x) { return x !== dir; }); if (on) held.push(dir); return held; }
  function last(held) { return held[held.length - 1]; }
  function ahead(s) { var d = DIRS[s.dir]; return [s.x + d[0], s.y + d[1]]; }
  function walkFrame(s) { return s.mv ? (Math.floor((s.anim || 0) / WALKF) % 2) + 1 : 0; }

  function nearestOpen(x, y, w, h, open) {
    var seen = {}, q = [[x, y]]; seen[x + ',' + y] = true;
    while (q.length) {
      var c = q.shift();
      if (open(c[0], c[1])) return c;
      ['up', 'left', 'right', 'down'].forEach(function (k) {
        var nx = c[0] + DIRS[k][0], ny = c[1] + DIRS[k][1];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h || seen[nx + ',' + ny]) return;
        seen[nx + ',' + ny] = true; q.push([nx, ny]);
      });
    }
    return null;
  }

  function camera(s, mapW, mapH, vw, vh) {
    var mw = mapW * TILE, mh = mapH * TILE;
    var x = mw <= vw ? (mw - vw) / 2 : clamp(s.px + 8 - vw / 2, 0, mw - vw);
    var y = mh <= vh ? (mh - vh) / 2 : clamp(s.py + 8 - vh / 2, 0, mh - vh);
    return [Math.round(x), Math.round(y)];
  }

  function fit(box, canvas, maxH) {
    var r = box.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    var w = VIEW_W, h = clamp(Math.round(VIEW_W * r.height / r.width), VIEW_MIN_H, maxH || VIEW_MAX_H);
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').imageSmoothingEnabled = false;
    return { w: w, h: h, boxW: r.width, boxH: r.height };
  }

  window.StudioMove = { TILE: TILE, STEPF: STEPF, DIRS: DIRS, place: place, update: update, hold: hold, last: last, ahead: ahead, walkFrame: walkFrame, camera: camera, nearestOpen: nearestOpen, fit: fit };
})();

</script>
<script>/* ../../../engine/clock.js */
// Studio clock: runs a game's logic at a steady 60 ticks a second, whatever the phone's screen rate, for every game.
// Walking counts its steps in ticks (engine/move.js: 10 ticks a step), so without this a 120 Hz screen
// walks twice as fast as the iPhone SE's 60 Hz screen, and a 30 Hz one (iPhone Low Power Mode) half as fast.
// Knows nothing about any game.
//
//   var clock = StudioClock.make();
//   function loop(now) {                  // now: the timestamp requestAnimationFrame passes in
//     var n = clock.ticks(now);           // how many 1/60 s ticks have passed since the last frame (0 to 4)
//     if (n) { for (var i = 0; i < n; i++) update(); draw(); }
//     raf = requestAnimationFrame(loop);
//   }
//   clock.reset()                         // call when the loop (re)starts, so time spent away isn't caught up
//
// 60 Hz: one tick every frame, as before. 120 Hz: a tick every other frame, and the frames in between are
// skipped (nothing would change on screen). 90 Hz: two ticks every three frames. 30 Hz: two ticks a frame.

        if (best[nk] === undefined || g < best[nk]) { best[nk] = g; came[nk] = { n: cur.n }; open.push({ n: e[0], g: g, f: g + h(e[0]) }); }

<script>/* ../../../engine/backup.js */
// Studio backup file: every save key a game keeps, written to one file the player saves to the phone's Files, and read
// back on another phone (first built for Sarah's Sim spec 001: its bible's Saves sets a file, not a text code, as its
// named exception to studio-bible/saves.md). Knows nothing about any game.
//
//   StudioBackup.collect(prefix)            {key without prefix: value} for every localStorage key under the prefix
//   StudioBackup.file(o)                    makes the backup: o = {game, prefix, version, name}. On a phone that can share
//                                           files (iOS), the share sheet opens so it can go to Files; elsewhere it downloads.
//                                           Resolves to 'shared', 'downloaded' or 'cancelled'.
//   StudioBackup.pick()                     lets the player choose a file; resolves to the text inside, or null
//   StudioBackup.read(text, game)           the backup object {game, version, made, keys}, or null when it isn't one of ours
//   StudioBackup.restore(obj, prefix, keep) replaces every key under the prefix with the backup's (keys listed in keep
//                                           stay as they are on this phone)
(function () {
  function collect(prefix) {
    var out = {};
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k.indexOf(prefix) === 0) out[k.slice(prefix.length)] = localStorage.getItem(k); }
    return out;
  }
  function file(o) {
    var obj = { game: o.game, version: o.version, made: new Date().toISOString(), keys: collect(o.prefix) };
    var text = JSON.stringify(obj), name = o.name || (o.game + '-backup.json');
    var blob = new Blob([text], { type: 'application/json' });
    var f = null; try { f = new File([blob], name, { type: 'application/json' }); } catch (e) {}
    if (f && navigator.canShare && navigator.share && navigator.canShare({ files: [f] })) {
      return navigator.share({ files: [f], title: name }).then(function () { return 'shared'; }, function () { return 'cancelled'; });
    }
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return Promise.resolve('downloaded');
  }
  function pick() {
    return new Promise(function (res) {
      var inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain';
      inp.style.display = 'none'; document.body.appendChild(inp);
      inp.addEventListener('change', function () {
        var f = inp.files && inp.files[0]; inp.remove();
        if (!f) return res(null);
        var r = new FileReader(); r.onload = function () { res(String(r.result)); }; r.onerror = function () { res(null); }; r.readAsText(f);
      });
      inp.click();
    });
  }
  function read(text, game) {
    try { var o = JSON.parse(text); return o && o.game === game && o.keys && typeof o.keys === 'object' ? o : null; } catch (e) { return null; }
  }
  function restore(obj, prefix, keep) {
    keep = keep || [];
    Object.keys(collect(prefix)).forEach(function (k) { if (keep.indexOf(k) < 0) localStorage.removeItem(prefix + k); });
    Object.keys(obj.keys).forEach(function (k) { if (keep.indexOf(k) < 0) localStorage.setItem(prefix + k, obj.keys[k]); });
  }
  window.StudioBackup = { collect: collect, file: file, pick: pick, read: read, restore: restore };
})();

</script>

<script>/* model.js */
// Sarah's Sim piece model: every piece is drawn from boxes, cylinders and small sprites in its own local space, so all
// four turns come out right (bible, Decorating, Placing: pieces turn 4 ways). The look follows mockups/furniture-sheet-v1
// (Rich detail: outlines, 3 to 4 tones, fabric weave, wood grain, piping, props). Light from the upper left: a box's top is
// the light tone, its left-front (+y) face the base and its right-front (+x) face the shade (bible, Art).
// Texture is light shading only, so it shows under any color; a painted pattern replaces it on its part
// (bible, Decorating, Furniture art; spec 001, part D).
//
// Local space: a piece is w x d tiles at turn 0, u along x and v along y; v = 0 is its back, v = d its front (the side
// that faces the left-front at turn 0). Heights are px above where it stands.
(function () {
  var I = SS.I = StudioIso.grid(22, 11);
  var INK = 'rgba(59,36,48,.85)';
  var poly = StudioIso.poly;

  // texture patterns, made once
  var PAT = {};
  function pat(c, key, w, h, draw) {
    if (!PAT[key]) { var cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d')); PAT[key] = cv; }
    return c.createPattern(PAT[key], 'repeat');
  }
  function clip(c, pts, fn) { c.save(); c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); c.clip(); fn(); c.restore(); }
  function bounds(pts) { var l = 1e9, r = -1e9, t = 1e9, b = -1e9; pts.forEach(function (p) { l = Math.min(l, p[0]); r = Math.max(r, p[0]); t = Math.min(t, p[1]); b = Math.max(b, p[1]); }); return [l, t, r, b]; }
  function lerp(a, b, k) { return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]; }
  function line(c, a, b, col, w) { c.strokeStyle = col; c.lineWidth = w || 1; c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke(); c.lineWidth = 1; }
  SS.line = line; SS.clip = clip; SS.lerp = lerp;

  // a painted pattern over a face (fabric parts only), drawn in screen space so it reads at this size
  function pattern(c, pts, name, R) {
    clip(c, pts, function () {

<script>/* scene.js */

<script>/* clock.js */
// Sarah's Sim clock and light (spec 006, part A). Life mode reads the phone's clock: no game days run faster than real ones.
// Four light looks, changing smoothly over about 20 real minutes at each edge:
//   morning (6 to 11 AM) soft gold light from the windows; daytime (11 AM to 5 PM) bright; evening (5 to 10 PM) a warm sunset

    [1030, { mul: '#ffc4a0', sky: ['#8a5a8e', '#f29a6c'], glow: .8, dark: .25, stars: 0 }],

    [1310, { mul: '#6c639a', sky: ['#1e1636', '#4a2c55'], glow: 1.3, dark: .85, stars: 1 }],
    [1330, { mul: '#53508e', sky: ['#120d22', '#2b1d3a'], glow: 1.4, dark: 1, stars: 1 }],
    [1440, { mul: '#53508e', sky: ['#120d22', '#2b1d3a'], glow: 1.4, dark: 1, stars: 1 }]

<script>/* save.js */
// Sarah's Sim saves (bible, Saves; spec 001, part A; studio-bible/saves.md). Keys, under the 'ss.' prefix (Dev builds keep
// their own, 'dev.ss.', engine/studio.js):
//   ss.version     the save version (1 from the first build); older saves are backed up, then each upgrade step runs
//   ss.gift        '1' once the first-open gift has been opened, for the whole game (never shows again)
//   ss.last        the mode she played last: 'sandbox' or 'life' (Continue opens it)
//   ss.sandbox     Sandbox's save: its home and pieces (and stored pieces)
//   ss.life        Life's save: its home and pieces, coins, crafts made, the painting pool's shown list
//   ss.favorites   rooms and outfits, shared by every mode (spec 001, part E, not built yet: kept empty)
//   ss.backupAt    when she last made a backup file; ss.remindAt  when the title may offer one again
// A backup file holds every key above (engine/backup.js), so importing on a new phone keeps every mode, the favorites
// and the gift.
(function () {
  var VERSION = SS.SAVE_VERSION = 1;
  var PRE = SS.PRE = (window.Studio ? Studio.savePrefix('ss.') : 'ss.');
  // upgrade steps: UPGRADES[n] turns a version n save into version n + 1. Old steps are never changed.
  var UPGRADES = {};
  function get(k) { try { return localStorage.getItem(PRE + k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(PRE + k, v); } catch (e) {} }
  SS.store = { get: get, set: set };

  SS.loadAll = function () {
    var v = +get('version') || 0, has = get('sandbox') || get('life');
    if (has && v < VERSION) {
      // back up the older saves first (studio-bible/saves.md), then run each step above the stored version, in order
      ['sandbox', 'life', 'favorites'].forEach(function (k) { var s = get(k); if (s) set('old.v' + v + '.' + k, s); });
      for (var n = v; n < VERSION; n++) if (UPGRADES[n]) ['sandbox', 'life'].forEach(function (k) { var s = get(k); if (s) set(k, JSON.stringify(UPGRADES[n](JSON.parse(s), k))); });
    }
    set('version', String(VERSION));
    if (!get('favorites')) set('favorites', '[]');
  };
  SS.modeSave = function (mode) {
    var s = get(mode);
    if (s) { try { return JSON.parse(s); } catch (e) {} }
    return null;
  };
  // a new save for a mode: the furnished Philly home (spec 001, part F; in Sandbox and Life it starts the same)
  SS.newSave = function (mode) {
    var s = { v: VERSION, mode: mode, home: 'philly', pieces: SS.World.startPieces(SS.HOMES.philly), stored: [], made: [], started: Date.now() };
    if (mode === 'life') { s.coins = 500; s.shown = { painting: [] }; }   // Life starts with 500 coins (spec 006, part A)
    return s;
  };
  SS.writeMode = function (mode, s) { s.savedAt = Date.now(); set(mode, JSON.stringify(s)); set('last', mode); SS.lastSaved = Date.now(); };
  SS.hasAnySave = function () { return !!(get('sandbox') || get('life')); };
  SS.lastMode = function () { var m = get('last'); return m && get(m) ? m : (get('life') ? 'life' : get('sandbox') ? 'sandbox' : null); };
  SS.giftOpened = function () { return get('gift') === '1'; };
  SS.markGift = function () { set('gift', '1'); };
  // the backup reminder: about once a month, once she has a save (bible, Saves, Reminders)
  var MONTH = 30 * 24 * 3600 * 1000;
  SS.wantsBackup = function () {

  SS.notNow = function () { set('remindAt', String(Date.now() + MONTH)); };

    var d = new Date(), name = 'sarahs-sim-backup-' + d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2) + '.json';
    set('backupAt', String(Date.now())); set('remindAt', String(Date.now() + MONTH));
    return StudioBackup.file({ game: 'sarahs-sim', prefix: PRE, version: VERSION, name: name });
  };
  SS.readBackup = function (text) { return StudioBackup.read(text, 'sarahs-sim'); };
  SS.restoreBackup = function (obj) { StudioBackup.restore(obj, PRE); SS.loadAll(); };
})();

<script>/* needs.js */
// Sarah's Sim needs (spec 006, part C). People have three soft needs: energy (moon), hunger (bowl) and fun (star).
//   - Each goes down slowly only while the game is open: full to low in about 40 minutes of play (Claude default). Nothing
//     drains while she's away (bible, Away from the game).
//   - Actions fill them (spec 006, part B's table). Below a quarter Sarah yawns, sighs or her tummy rumbles, and actions take
//     a little longer. That's all: no need can hurt her, stop her or end anything (pillar 3).
//   - Tapping Sarah shows her three meters, each with its icon and word (studio-bible/ui.md, color is never the only label);
//     tapping Keegan shows his beside his bubble. Hidden the rest of the time. Keegan looks after his own (idle life).
//   - Sandbox has no needs (bible, Modes).
// Meters drawn as in the approved mockups/cooking-v1 ('bubble' state).
(function () {

    var S = G.save; if (!S.needs) S.needs = { sarah: { energy: .8, hunger: .7, fun: .75 }, keegan: { energy: .85, hunger: .75, fun: .8 } };

  SS.catNeedsOf = function (G, who) {

// Sarah's Sim people and cats in the home.
//   Sandbox (spec 001, part B): Louie and Ralph wander, nap on furniture she places and react to new pieces (bible, The cats);
//   Keegan and Sarah stand or sit somewhere fitting.
//   Life (spec 006, part B): she taps the floor to walk Sarah there, around furniture and up the stairs (the D-pad walks her
//   too), and taps a piece, a cat or Keegan for an action bubble. Sarah walks over and does it with a short animation; a slim
//   bar over her head shows how long is left. One action at a time, up to 3 lined up. Tapping anywhere else stops it.

      pose: kind === 'cat' ? 'sit' : 'stand', flip: false, back: false, walked: 0, on: null, bubble: null, bar: null, wait: rand(1, 4), react: null };
    a.tile = function () { return { f: a.f, x: Math.floor(a.x), y: Math.floor(a.y) }; };

<script>/* phone.js */
// Sarah's Sim: idle Sarah and her phone (spec 006, part D).
//   - Idle Sarah: the game opens with Sarah in the middle of something from the time of day's pool (private data; a generic
//     placeholder in the repo). As soon as she taps anything, Sarah stops and is hers to play.
//   - Her phone is always about to die (Keegan, Nov 25): its battery runs down while she scrolls, only while the game is open.
//     When it's low, a red low-battery icon pops over her head and she holds the phone up in despair. Tapping her shows Charge,
//     and she goes looking for the charger, which is never where she left it: under a couch cushion, in the bed sheets, or
//     under Ralph, from a pool that doesn't repeat until it's used up (saved). Finding it is a tap on the right spot; a bouncing
//     question mark floats over every spot it could be, and a wrong guess loses its mark. A dead phone only means no calls or photos until it's charged; nothing else is lost.
(function () {
  var DRAIN = 1 / (15 * 60), CHARGE = 1 / (3 * 60);   // a full battery lasts about 15 minutes of scrolling; charging takes about 3
  SS.phoneOf = function (G) { var S = G.save; if (S.phone === undefined) S.phone = .6; return S.phone; };
  var HIDES = [
    { key: 'cushion', where: 'under a couch cushion', use: 'sofa' },
    { key: 'sheets', where: 'in the bed sheets', use: 'bed' },
    { key: 'ralph', where: 'under Ralph', cat: 'ralph' }
  ];
  function pickHide(G) {
    var S = G.save; S.shown = S.shown || {}; var sh = S.shown.charger || (S.shown.charger = []);
    var ok = HIDES.filter(function (h) { return h.cat || G.W.pieces.some(function (p) { return G.W.def(p).use === h.use; }); });
    var left = ok.filter(function (h) { return sh.indexOf(h.key) < 0; }); if (!left.length) { sh.length = 0; left = ok.slice(); }
    var h = left[Math.floor(Math.random() * left.length)]; sh.push(h.key); return h;
  }
  // the idle activity she's in when Life opens
  SS.startSarahIdle = function (G) {
    if (G.mode !== 'life') return;
    var d = SS.now(), h = d.getHours(), part = h >= 6 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'daytime' : h >= 17 && h < 22 ? 'evening' : 'lateNight';
    var pool = (((window.SS_PRIVATE || {}).sarahIdle || {})[part]) || [];
    if (!pool.length) return;
    var S = G.save; S.shown = S.shown || {}; var key = 'sarah.' + part, sh = S.shown[key] || (S.shown[key] = []);
    var left = pool.filter(function (x) { return sh.indexOf(x.text) < 0; }); if (!left.length) { sh.length = 0; left = pool.slice(); }
    var act = left[Math.floor(Math.random() * left.length)]; sh.push(act.text);
    var W = G.W, s = G.people.sarah, ps = W.pieces.filter(function (p) { return W.def(p).use === act.at && W.useTiles(p).length; });
    var p = ps[0]; if (!p) return;
    var ut = W.useTiles(p)[0]; s.f = W.floorOf(p); s.x = ut[0] + .5; s.y = ut[1] + .5; s.path = [];
    var d2 = W.def(p); if (d2.seat && act.at !== 'easel' && act.at !== 'bookshelf') SS.seatSarah(G, p, d2.use === 'bed' ? 'lie' : 'sit');
    if (act.at === 'easel') p.work = true;
    G.idle = { text: act.text, phone: !!act.phone, piece: p.uid };
    G.setFloor(s.f);
  };
  SS.stopSarahIdle = function (G) { if (!G.idle) return; var p = G.W.byUid[G.idle.piece]; if (p) p.work = false; G.idle = null; G.people.sarah.extra = null; G.people.sarah.arms = null; };

    if (G.mode !== 'life') return;
    var s = G.people.sarah, S = G.save;
    SS.phoneOf(G);
    if (G.charging) { S.phone = Math.min(1, S.phone + CHARGE * dt); if (S.phone >= 1) { G.charging = false; s.bubble = { icon: 'heart', until: performance.now() + 2000 }; G.toast('PHONE CHARGED', 1600); } }
    else if (G.idle && G.idle.phone) S.phone = Math.max(0, S.phone - DRAIN * dt);
    var low = S.phone < .2;
    // scrolling on her phone, and the low-battery despair
    // scrolling: both hands at her chest, eyes on the screen (sprites.js, the phone arms); the low-battery despair holds it up
    s.arms = G.idle && G.idle.phone && !low ? 'phone' : null;
    s.extra = G.idle && G.idle.phone && low ? function (c, p) {
      var x = Math.round(p[0] + (s.flip ? -6 : 3)), y = Math.round(p[1] - (s.pose === 'sit' ? 17 : 24) - 6);
      c.fillStyle = '#3b2430'; c.fillRect(x, y, 4, 6); c.fillStyle = low ? '#5a4650' : '#a9c9e8'; c.fillRect(x + 1, y + 1, 2, 4);
      if (low && Math.floor(performance.now() / 400) % 2) { var bx = Math.round(p[0] - 4), by = Math.round(p[1] - 54); c.fillStyle = '#fff6ea'; c.fillRect(bx - 2, by - 2, 14, 9); c.fillStyle = '#d2363c'; c.fillRect(bx, by, 8, 5); c.fillRect(bx + 8, by + 1, 1, 3); c.fillStyle = '#fff6ea'; c.fillRect(bx + 2, by + 1, 5, 3); c.fillStyle = '#d2363c'; c.fillRect(bx + 1, by + 1, 1, 3); }
    } : (G.charging ? function (c, p) { var x = Math.round(p[0] - 4), y = Math.round(p[1] - 50); c.fillStyle = '#3b2430'; c.fillRect(x, y, 9, 5); c.fillStyle = '#8cc06a'; c.fillRect(x + 1, y + 1, Math.round(7 * S.phone), 3); c.fillRect(x + 9, y + 1, 1, 3); } : (G.act ? s.extra : null));
  };
  // Charge: the hunt for the charger
  // every place the charger could be in this home: each sofa (its cushions), each bed (its sheets), and Ralph
  function spotsOf(G) {
    var W = G.W, out = [];
    W.pieces.forEach(function (p) { var u = W.def(p).use; HIDES.forEach(function (h) { if (h.use && h.use === u) out.push({ key: 'p' + p.uid, hide: h, piece: p }); }); });
    HIDES.forEach(function (h) { if (h.cat && G.cats[h.cat]) out.push({ key: 'cat:' + h.cat, hide: h, agent: G.cats[h.cat] }); });

  }

    return spotsOf(G).filter(function (sp) { return sp.key === key; })[0] || null;
  }
  SS.startHunt = function (G) {
    SS.stopSarahIdle(G);
    var h = pickHide(G), S = G.save;
    var spots = spotsOf(G).filter(function (sp) { return sp.hide === h; });   // which cushion, which sheets: one real spot
    var at = spots[Math.floor(Math.random() * spots.length)];
    G.hunt = { hide: h, spot: at ? at.key : null, gone: [] };
    S.huntedOnce = true;
    G.toast('WHERE\'S THE CHARGER?', 2400, 'Tap a question mark to look there. Tap the floor to stop.');
  };
  // during a hunt, does this tap land on a place the charger could be? Only those taps count as guesses
  SS.huntSpot = function (G, pick) { return !!spotOfPick(G, pick); };

  SS.huntTap = function (G, pick) {

    }

    G.changed(true);

  };

    if (!G.hunt) return [];
    var W = G.W;
    return spotsOf(G).filter(function (sp) { return G.hunt.gone.indexOf(sp.key) < 0; }).map(function (sp) {
      return { key: sp.key, f: sp.agent ? sp.agent.f : W.floorOf(sp.piece), agent: sp.agent, piece: sp.piece };
    });
  };
})();

  // ---------- the home screen ----------
  function drawHome(H, t, now) {

    var hits = SS.drawScene(wc, W, { version: G.version + ':' + (G.hold ? G.hold.from : ''), floor: G.floor, walls: G.walls, t: t, look: G.look, agents: G.agents, glows: glows, ghost: ghost, sel: G.sel });

    var src = G.cam.src();
    c.imageSmoothingEnabled = false;

      var sym = G.hold.ok ? '✓' : '✕';

    } else if (G.hold) { var gq2 = ghostScreen(G.hold), gs2 = toScreen(gq2[0], gq2[1] - 26); markFit(gs2[0], gs2[1], G.hold.ok); }
    var sel = G.sel && W.byUid[G.sel];
    if (sel && !G.paint) {
      var sw = selTop(sel), ss = toScreen(sw[0], sw[1]);
      var chips = []; if (W.def(sel).kind !== 'wall') chips.push({ icon: 'turn', fn: function () { turnPiece(sel); } });
      chips.push({ icon: 'move', fn: function () { G.startMove(sel); } }, { icon: 'away', fn: function () { G.putAway(sel); } });
      SS.drawChips(G, ss[0], Math.max(24, ss[1] - 18), chips);
    }
    // the hint line
    var hint = G.hold ? (G.hold.ok ? 'DRAG TO MOVE · TAP IT TO TURN · OK PLACES' : (G.hold.why === 'DOORWAY' ? 'KEEP DOORWAYS CLEAR' : G.hold.why === 'NEEDS A WINDOW' ? 'CURTAINS GO ON A WINDOW' : G.hold.why === 'STAIRS' ? 'KEEP THE STAIRS CLEAR' : 'IT DOESN\'T FIT HERE'))

    if (hint && !G.menu) SS.txt(hint, W0 / 2, H - trayH - 12, 'rgba(255,241,226,.85)', 5, 'center');
    // the charger hunt's hint: a bouncing marker over the spot, the first time (spec 006, part D)
    SS.huntMarks(G).forEach(function (hm, i) {
      if (hm.f !== G.floor) return;
      var hp = hm.agent ? SS.vp(hm.agent.x, hm.agent.y, hm.f * FH + (hm.agent.z || 0) + 26) : selTop(hm.piece), hs = toScreen(hp[0], hp[1]), bob = Math.round(Math.sin(now / 200 + i * 1.7) * 2);
      var mx = Math.round(hs[0]), my = Math.round(hs[1] - 6 + bob);
      SS.R(mx - 5, my - 11, 11, 10, '#3b2430'); SS.R(mx - 4, my - 10, 9, 8, SS.P.rose); SS.txt('?', mx + 1, my - 9, '#fff', 6, 'center');
      SS.R(mx - 1, my - 2, 3, 2, SS.P.rose); SS.R(mx, my, 1, 2, SS.P.rose);
    });
    if (G.sleeping) sleepScene(H - trayH, now);
    SS.drawTopBar(G, W0);
    SS.drawViewControls(G, W0, G.mode === 'life' && (G.act || G.queue.length) ? 40 : 24, H - trayH - 16);
    SS.drawTray(G, W0, H);
    if (G.slideBack) slideBackAnim(now, H);
    if (G.bubble) SS.drawBubble2(G, W0, G.bubble);

  }
  function markFit(x, y, ok) { if (ok) SS.check(x - 4, y + 2, '#8fd08c'); else SS.cross(x - 3, y + 2, '#e46f8b'); }
  function selTop(p) { var W = G.W, d = W.def(p), f = W.floorOf(p), Z = f * FH; if (p.wall) { var wp = W.wallPlace(p); return SS.vp(wp.x + (p.wall[2] === 'x' ? d.w / 2 : 0), wp.y + (p.wall[2] === 'y' ? d.w / 2 : 0), Z + wp.z + d.h); } if (p.host) { var pos = W.spotPos(W.hostOf(p), p.spot); return SS.vp(pos.x, pos.y, Z + pos.z + d.h + 6); } var ft = W.foot(p); return SS.vp((ft[0] + ft[2]) / 2, (ft[1] + ft[3]) / 2, Z + Math.min(60, d.h + 8)); }
  function ghostItem(Hd, t) {
    var W = G.W, cd = candOf(Hd), d = SS.DEF[Hd.inst.id], inst = Hd.inst, lift = 6 + Math.round(Math.sin(t / 2));
    var tmp = { uid: 'ghost', id: inst.id, r: Hd.r, sw: inst.sw, colors: inst.colors, pats: inst.pats, props: inst.props, lit: inst.lit };

    else if (cd.host) { var pos = W.spotPos(W.byUid[cd.host], cd.spot); place = { rot: Hd.r }; wx = pos.x - .5; wy = pos.y - .5; wz = pos.z + 3; }
    else if (cd.x !== undefined) { place = { rot: Hd.r }; wx = cd.x; wy = cd.y; wz = lift; if (d.kind === 'rug') wz = 2; }
    else return null;

    var sp = SS.pieceSprite(tmp, null, t, { rot: vq.rot }), vb = SS.vrect(wx, wy, wx + (cd.wall ? .2 : sz[0]), wy + (cd.wall ? .2 : sz[1]));

    } };

  }
  function sleepScene(h, now) { // Sleep: the screen fades to a cozy sleeping scene (spec 006, part B, Sleep)
    var k = Math.min(1, ((G.act && G.act.t) || 0) / 2);
    c.fillStyle = 'rgba(28,22,48,' + (.65 * k) + ')'; c.fillRect(0, 0, W0, h);

    for (var i = 0; i < 14; i++) { var tw = (Math.floor(now / 400) + i) % 5 === 0; c.fillStyle = tw ? '#fff' : 'rgba(255,241,226,.6)'; c.fillRect(Math.round(SS.rnd(i) * W0), Math.round(30 + SS.rnd(i + 9) * (h - 80)), 1, 1); }
    SS.txt('SWEET DREAMS', W0 / 2, h / 2 - 4, '#fff1e2', 8, 'center');
    var zz = Math.floor(now / 500) % 3; SS.txt('z z z'.slice(0, 1 + zz * 2), W0 / 2, h / 2 + 10, 'rgba(255,241,226,.8)', 6, 'center');

  // ---------- the loop ----------
  var clock = StudioClock.make(), lastT = performance.now(), lastSecond = 0, lastDraw = 0;
  function loop(now) {
    var n = clock.ticks(now);
    var dt = Math.min(.1, (now - lastT) / 1000); lastT = now;

        if (G.zoomTo) { G.cam.zoom += (G.zoomTo - G.cam.zoom) * .3; if (Math.abs(G.zoomTo - G.cam.zoom) < .01) { G.cam.zoom = G.zoomTo; G.zoomTo = null; } }

})();
