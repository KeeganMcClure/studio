<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life After</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Life After's shell paint (spec 001, 1): from the baseline frame's NIGHT and DAY sets and the approved look
   mockups (05 builder v2): a muted teal body, a near-black bezel, a cyan LED, rust A and B. */
:root{--page:#0e1012;--shell:#3e4f4c;--shell-hi:#56696a;--shell-lo:#2a3533;--bezel:#121518;--bezel-edge:#08090a;--brand-ink:#9aa6a0;
  --led:#3ff0e8;--led-off:#22302e;--scr-bg:#0c0e10;--scr-fg:#e8dcc0;--scr-hi:#e8c88a;--btn:#1a2022;--label:#9aa6a0;
  --btn-a:#b4582e;--btn-b:#6a3424;--btn-ink:#f2ead6;--px:"Press Start 2P",ui-monospace,Menlo,monospace;--vt:"VT323",ui-monospace,Menlo,monospace;color-scheme:dark}
body{margin:0}
</style>
<style>/* ../../../engine/shell.css */
/* Studio shell: the GBA-style handheld every game plays inside (studio-bible/controls.md, Shell and Buttons).
   Layout, button sizes and the size steps are shared; each game paints it by setting these on :root:
     --page (behind the shell)  --shell --shell-hi --shell-lo (body)  --bezel --bezel-edge (screen surround)
     --brand-ink (brand strip text)  --led --led-off  --scr-bg --scr-fg --scr-hi (screen, focus ring)
     --btn --label (D-pad, L/R shoulders, Select/Start)  --btn-a --btn-b --btn-ink (A and B)  --px --vt (fonts)
   The markup comes from engine/shell.js. Loaded by each game's index.html, before the game's own styles,
   and inlined by the game's build, so dist/index.html stays one file. */
html,body{height:100%}
body{background:var(--page);color:var(--scr-fg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{height:100%;display:flex;justify-content:center;box-sizing:border-box;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-block:4px}
.shell{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;padding:6px 12px 10px;border-radius:16px 16px 34px 34px;
  background:linear-gradient(170deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.5)}
/* L and R are wide shoulder buttons in the top corners of the controls, right under the screen (spec 003, Nov 21, 2026).
   The row tucks into the shell's gap above the controls (negative margin), so the screen loses only the buttons' height. */
.shoulders{flex:none;display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:-6px}
.mid{display:flex;flex-direction:column;align-items:center;gap:var(--midgap)}
.sh{width:var(--shw);height:var(--shh);border:0;border-radius:5px;background:var(--btn);color:var(--label);font:9px var(--px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.sh.l{border-top-left-radius:12px}.sh.r{border-top-right-radius:12px}
.bezel{flex:1;min-height:0;background:var(--bezel);border-radius:10px 10px 26px 10px;padding:10px 10px 6px;display:flex;flex-direction:column;gap:5px;box-shadow:inset 0 0 0 2px var(--bezel-edge)}
.brand{display:flex;justify-content:space-between;align-items:center;font:7px var(--px);color:var(--brand-ink);letter-spacing:.08em}
.led{width:7px;height:7px;border-radius:50%;background:var(--led);box-shadow:0 0 6px var(--led);display:inline-block;margin-right:6px;vertical-align:middle}
.led.off{background:var(--led-off);box-shadow:none}
.screen{flex:1;min-height:0;position:relative;background:var(--scr-bg);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;font:20px/1.05 var(--vt);transition:filter .4s}
.ctrls{flex:none;display:grid;grid-template-columns:auto auto auto;justify-content:space-between;align-items:center;gap:6px;padding:4px 0 0}
.dpad{display:grid;grid-template-columns:repeat(3,var(--pad));grid-template-rows:repeat(3,var(--pad))}
.dpad button{border:0;background:var(--btn);color:var(--label);font:10px var(--px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.45)}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.dpad .c{grid-area:2/2;background:var(--btn);pointer-events:none;box-shadow:none}
.ab{position:relative;width:calc(var(--ab)*2.15);height:calc(var(--ab)*1.85)}
.ab button{position:absolute;width:var(--ab);height:var(--ab);border-radius:50%;border:0;color:var(--btn-ink);font:13px var(--px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),0 3px 0 rgba(0,0,0,.35)}
.ab .a{right:0;top:6px;background:var(--btn-a)}
.ab .b{left:0;top:calc(var(--ab)*.82);background:var(--btn-b)}
.ss{display:flex;gap:8px;align-items:flex-start}
.ss>div{width:var(--pill);display:flex;flex-direction:column;align-items:center}
.ss button{width:calc(var(--pill) - 4px);height:14px;border-radius:9px;border:0;background:var(--btn);box-shadow:inset 0 -2px 0 rgba(0,0,0,.45);transform:rotate(-22deg)}
.ss span{display:block;font:6px var(--px);color:var(--label);margin-top:10px;text-align:center}  /* the tilted pill reaches about 8 px below its box; 10 px keeps the label clear (bug, Nov 21) */
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,button.down{filter:brightness(1.35);transform:translateY(1px)}
.ss button:active{transform:rotate(-22deg) translateY(1px)}
button:focus-visible{outline:2px solid var(--scr-hi);outline-offset:2px}
:root{--pad:42px;--ab:54px;--pill:46px;--midgap:16px;--shw:80px;--shh:24px}
@media (max-height:700px),(max-width:380px){:root{--pad:38px;--ab:48px;--pill:42px;--midgap:12px}.bezel{padding:7px 7px 5px}}
@media (max-height:560px),(max-width:340px){:root{--pad:34px;--ab:42px;--pill:40px;--midgap:9px}.brand{display:none}}
@media (max-height:480px){:root{--pad:30px;--ab:38px;--pill:38px;--midgap:7px;--shw:72px;--shh:22px}}

</style>
<style>
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
/* Typing (a name, a seed, a save code): a cardboard card over the screen, so the phone keyboard can be used. */
#ovl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,10,12,.72);padding:10px;box-sizing:border-box}
#ovl.on{display:flex}
#ovl .cb{width:100%;max-width:340px;box-sizing:border-box;background:#c09a64;background:radial-gradient(ellipse at 32% 25%,#d2ac74 0 38%,#c09a64 39%);
  border:3px solid #a6824e;border-bottom-color:#86683c;border-right-color:#86683c;padding:12px;color:#1c1a18;box-shadow:3px 3px 0 rgba(0,0,0,.45);position:relative}
#ovl .cb:before,#ovl .cb:after{content:"";position:absolute;top:-6px;width:34px;height:11px;background:#a8aca8;border-top:2px solid #c4c8c4;border-bottom:2px solid #868a86}
#ovl .cb:before{left:-8px;transform:rotate(-8deg)}#ovl .cb:after{right:-8px;transform:rotate(7deg)}
#ovl h2{font:9px/1.6 var(--px);color:#8a2a1e;margin:0 0 8px}
#ovl p{font:20px/1 var(--vt);margin:0 0 8px}
#ovl input,#ovl textarea{width:100%;box-sizing:border-box;font:22px/1 var(--vt);color:#1c1a18;background:#ece6d8;border:2px solid #86683c;padding:4px 6px;outline:none;
  -webkit-user-select:text;user-select:text;border-radius:0}
#ovl textarea{height:96px;resize:none;font-size:16px;word-break:break-all}
#ovl input:focus,#ovl textarea:focus{border-color:#3ff0e8}
#ovl .bt{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
#ovl button{flex:1;min-width:90px;font:8px var(--px);color:#1c1a18;background:#d2ac74;border:2px solid #86683c;padding:10px 6px}
#ovl button.go{border-color:#3ff0e8;outline:1px solid #3ff0e8}
#ovl .err{color:#8a2a1e;min-height:20px}
</style>
</head><body>
<div class="screen" id="screen" data-brand="LIFE AFTER" data-brand-sub=""
  data-label-l="L: bag" data-label-r="R: map" data-label-select="Select: orders" data-label-start="Start: menu">
  <canvas id="cv" aria-label="Life After"></canvas>
  <div id="ovl" role="dialog"></div>
</div>
<script>/* ../../../engine/shell.js */
// Studio shell: builds the GBA-style handheld around a game's screen (studio-bible/controls.md, Shell and Buttons).
// Shared by every game; the look comes from engine/shell.css and the game's own colors.
//
// The game's index.html holds only its screen, marked with the brand text and its own button labels:
//   <div class="screen" id="screen" data-brand="BLACK LANTERN" data-brand-sub="DOT MATRIX"
//        data-label-start="Start: menu">...</div>
//   <script src="../../../engine/shell.js"><\/script>   (first script, before any game code)
// Optional labels (spoken by screen readers): data-label-l, -r, -start, -select, -a, -b.
//
// It wraps the screen in the bezel with the brand strip and the LED (#led), then the shoulder row with
// L top left and R top right (#bL #bR, spec 003), then the controls row: D-pad ([data-pad]),
// Select and Start (#bSel #bStart), and A and B (#bA #bB).
// engine/input.js makes the buttons work.
(function () {
  var screen = document.getElementById('screen');
  if (!screen) throw new Error('shell.js: no #screen element');
  var d = screen.dataset;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var lab = function (k, def) { return esc(d['label' + k] || def); };

  var wrap = document.createElement('div');
  wrap.className = 'wrap';
  // Same markup, spacing included, as the hand-copied shell it replaced (Nov 21, 2026), apart from L and R,
  // which moved from the middle cluster into their own shoulder row under the screen (spec 003, Nov 21).
  wrap.innerHTML =
    '\n  <div class="shell">\n    <div class="bezel">\n' +
    '      <div class="brand"><span><span class="led" id="led"></span>' + esc(d.brand || '') + '</span><span>' + esc(d.brandSub || '') + '</span></div>\n' +
    '      <i data-screen></i>\n    </div>\n' +
    '    <div class="shoulders">\n' +
    '      <button class="sh l" id="bL" aria-label="' + lab('L', 'L: previous') + '">L</button>\n' +
    '      <button class="sh r" id="bR" aria-label="' + lab('R', 'R: next') + '">R</button>\n' +
    '    </div>\n' +
    '    <div class="ctrls">\n' +
    '      <div class="dpad">\n' +
    '        <button class="u" data-pad="up" aria-label="Up">▲</button>\n' +
    '        <button class="l" data-pad="left" aria-label="Left">◀</button>\n' +
    '        <span class="c"></span>\n' +
    '        <button class="r" data-pad="right" aria-label="Right">▶</button>\n' +
    '        <button class="d" data-pad="down" aria-label="Down">▼</button>\n' +
    '      </div>\n' +
    '      <div class="mid">\n' +
    '        <div class="ss">\n' +
    '          <div><button id="bSel" aria-label="' + lab('Select', 'Select') + '"></button><span>SELECT</span></div>\n' +
    '          <div><button id="bStart" aria-label="' + lab('Start', 'Start: menu') + '"></button><span>START</span></div>\n' +
    '        </div>\n' +
    '      </div>\n' +
    '      <div class="ab">\n' +
    '        <button class="a" id="bA" aria-label="' + lab('A', 'A: confirm') + '">A</button>\n' +
    '        <button class="b" id="bB" aria-label="' + lab('B', 'B: back') + '">B</button>\n' +
    '      </div>\n' +
    '    </div>\n  </div>\n';
  screen.parentNode.insertBefore(wrap, screen);
  var slot = wrap.querySelector('[data-screen]');
  slot.parentNode.replaceChild(screen, slot);
})();

</script>
<script>/* ../../../engine/studio.js */
// Studio link: the small piece every game shares with the launcher.
// Tells a game which build it is (Dev or Release), which save prefix to use,
// and reads the launcher's shared settings. Plain script, no framework.
// A game loads it before its own code: <script src="../../../engine/studio.js"><\/script>
(function () {
  var path = location.pathname;
  // Dev builds live under /dev/<game>/ on the site; everything else is Release.
  var channel = /\/dev\/[^/]+\/?(index\.html)?$/.test(path) ? 'dev' : 'release';
  var params = new URLSearchParams(location.search);

  var shelfUrl = channel === 'dev' ? '../../' : '../';
  // True when this game was opened from the game shelf (now, or earlier in this tab), so a game only offers
  // "back to the shelf" where there is one. A copy played elsewhere (the Black Lantern Intake page, a check
  // opening the file directly) has no shelf to go back to.
  var fromShelf = false;
  try {
    var shelf = new URL(shelfUrl, location.href).href;
    fromShelf = document.referrer.split(/[?#]/)[0].replace(/index\.html$/, '') === shelf || sessionStorage.getItem('studio.fromShelf') === shelf;
    if (fromShelf) sessionStorage.setItem('studio.fromShelf', shelf);
  } catch (e) {}

  window.Studio = {
    channel: channel,
    fromShelf: fromShelf,
    // True when the launcher's Continue button opened the game.
    continued: params.get('continue') === '1',
    // Dev builds keep their own saves, so testing never touches the stable one.
    // savePrefix('bl.') -> 'bl.' on Release, 'dev.bl.' on Dev.
    savePrefix: function (base) { return channel === 'dev' ? 'dev.' + base : base; },
    // Shared settings set in the launcher. Games read them and never keep their own copy.
    settings: function () {
      try { return JSON.parse(localStorage.getItem('studio.settings') || '{}'); } catch (e) { return {}; }
    },
    // Back to the game shelf. The launcher sits at the site root, one level up
    // from a Release game and two from a Dev game.
    shelfUrl: shelfUrl,
    toShelf: function () { location.href = window.Studio.shelfUrl; }
  };
})();

</script>
<script>/* ../../../engine/input.js */
// Studio input: the shell's buttons and the test keyboard, for every game (studio-bible/controls.md, Buttons and Keyboard).
// Needs the buttons from engine/shell.js. Knows nothing about any game: the game says where presses go.
//
//   StudioInput.start({
//     press(kind),       // every press: 'up' 'down' 'left' 'right' 'a' 'b' 'l' 'r' 'start' 'select'.
//                        // The game routes it (for example to the map while it's up, otherwise to the menus).
//     walking(),         // true while held directions should walk (the map is up)
//     hold(dir, on),     // a direction went down (on) or up while walking; also told to let go on lift and blur
//   });
//
// D-pad buttons fire once on press, then repeat after 320 ms every 85 ms (menus). While walking() the
// direction also counts as held until the finger lifts, slides off or the touch is cancelled.
// A, B, L, R, Start and Select fire on tap. Keys are ignored while a text field has focus, and Enter or
// Escape there only closes the phone keyboard. Leaving the window lets go of every direction.
// Later (Running, hold B): add an "is this button held?" query here so every game shares it.
(function () {
  var DIRS = ['up', 'down', 'left', 'right'];
  var KEYS = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    z: 'a', Z: 'a', ' ': 'a', x: 'b', X: 'b', q: 'l', Q: 'l', w: 'r', W: 'r',
    Enter: 'start', Backspace: 'select', Shift: 'select'   // Backspace = Select, Shift a second Select (controls.md, Nov 21)
  };
  var REPEAT_AFTER = 320, REPEAT_EVERY = 85;
  var typing = function () { var el = document.activeElement; return !!(el && el.tagName === 'INPUT'); };

  function start(o) {
    var press = o.press, walking = o.walking || function () { return false; }, hold = o.hold || function () {};
    var $ = function (s) { return document.querySelector(s); };

    // D-pad with hold-repeat
    document.querySelectorAll('[data-pad]').forEach(function (b) {
      var t1, t2, d = b.dataset.pad;
      var stop = function () { clearTimeout(t1); clearInterval(t2); b.classList.remove('down'); if (walking()) hold(d, false); };
      b.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        if (typing()) document.activeElement.blur();
        b.classList.add('down');
        if (walking()) hold(d, true);
        press(d);
        t1 = setTimeout(function () { t2 = setInterval(function () { press(d); }, REPEAT_EVERY); }, REPEAT_AFTER);
      });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, stop); });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    });

    // A, B, L, R, Start, Select: on tap
    [['#bA', 'a'], ['#bB', 'b'], ['#bL', 'l'], ['#bR', 'r'], ['#bStart', 'start'], ['#bSel', 'select']].forEach(function (p) {
      $(p[0]).addEventListener('click', function () { press(p[1]); });
    });

    // Keyboard, for testing on a computer
    document.addEventListener('keydown', function (e) {
      if (typing()) {
        // Enter (the phone keyboard's Go) or Escape only closes the keyboard; it must not also count as Start
        // (a game's own field handler can claim the key first with preventDefault)
        if (!e.defaultPrevented && (e.key === 'Enter' || e.key === 'Escape')) { e.preventDefault(); document.activeElement.blur(); }
        return;
      }
      var k = KEYS[e.key]; if (!k) return;
      e.preventDefault();
      if (walking() && DIRS.indexOf(k) >= 0) { if (e.repeat) return; hold(k, true); }
      press(k);
    });
    document.addEventListener('keyup', function (e) { var k = KEYS[e.key]; if (k && DIRS.indexOf(k) >= 0) hold(k, false); });
    window.addEventListener('blur', function () { DIRS.forEach(function (d) { hold(d, false); }); });
  }

  window.StudioInput = { start: start, KEYS: KEYS };
})();

</script>
<script>/* ../../../engine/move.js */
// Studio movement: grid walking on the map, the camera and the canvas fit, for every game
// (studio-bible/controls.md: Shell, and "on the map, the last direction pressed wins"; art-style.md: 16 px tiles).
// Knows nothing about any game. The game keeps its own state object and passes it in, so what a save
// holds (map, x, y, dir) doesn't change. The state's fields:
//   x, y      tile the lead stands on        px, py   pixel position (moves during a step)
//   dir       'up' 'down' 'left' 'right'     mv       the step in progress, or null
//   anim      frames walked, for the walk cycle
//
//   StudioMove.place(s, x, y, dir)           put the lead on a tile, standing still
//   StudioMove.update(s, dir, {passable(x, y), busy(), arrive()})
//                                            once per screen frame while the map is up. dir is the held
//                                            direction (StudioMove.last(held)) or null. arrive() runs on
//                                            reaching a tile (warps, step triggers).
//   StudioMove.hold(held, dir, on)           returns the new held list; the last one pressed wins
//   StudioMove.ahead(s)                      [x, y] of the tile the lead faces (A uses it)
//   StudioMove.walkFrame(s)                  0 standing, 1 or 2 walking
//   StudioMove.camera(s, mapW, mapH, vw, vh) [x, y]: follows the lead, stops at the map's edges, centers small maps
//   StudioMove.nearestOpen(x, y, w, h, open)  [x, y] of the nearest tile (steps on the grid, through walls) where
//                                            open(x, y) is true, or null: a saved spot that's now a wall moves here
//   StudioMove.fit(box, canvas)              sizes the canvas 240 px wide and as tall as the box's shape allows
//                                            (130 to 320), crisp pixels; returns {w, h, boxW, boxH}, or null while hidden
(function () {
  var TILE = 16, STEPF = 10, WALKF = 5;   // a step takes 10 frames (about 6 tiles a second at 60 Hz); frames change every 5
  var VIEW_W = 240, VIEW_MIN_H = 130, VIEW_MAX_H = 320;
  var DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };

  function place(s, x, y, dir) { s.x = x; s.y = y; s.dir = dir || 'down'; s.px = x * TILE; s.py = y * TILE; s.mv = null; }

  function update(s, dir, o) {
    var mv = s.mv;
    if (mv) {
      mv.t++;
      var k = mv.t / STEPF;
      s.px = Math.round((mv.fx + (mv.tx - mv.fx) * k) * TILE);
      s.py = Math.round((mv.fy + (mv.ty - mv.fy) * k) * TILE);
      s.anim = (s.anim || 0) + 1;
      if (mv.t >= STEPF) { s.x = mv.tx; s.y = mv.ty; s.mv = null; o.arrive(); }
      return;
    }
    if (o.busy() || !dir) return;
    // blocked: turn to face it without moving
    s.dir = dir;
    var d = DIRS[dir], nx = s.x + d[0], ny = s.y + d[1];
    if (o.passable(nx, ny)) s.mv = { fx: s.x, fy: s.y, tx: nx, ty: ny, t: 0 };
  }

  function hold(held, dir, on) { held = held.filter(function (x) { return x !== dir; }); if (on) held.push(dir); return held; }
  function last(held) { return held[held.length - 1]; }
  function ahead(s) { var d = DIRS[s.dir]; return [s.x + d[0], s.y + d[1]]; }
  function walkFrame(s) { return s.mv ? (Math.floor((s.anim || 0) / WALKF) % 2) + 1 : 0; }

  function nearestOpen(x, y, w, h, open) {
    var seen = {}, q = [[x, y]]; seen[x + ',' + y] = true;
    while (q.length) {
      var c = q.shift();
      if (open(c[0], c[1])) return c;
      ['up', 'left', 'right', 'down'].forEach(function (k) {
        var nx = c[0] + DIRS[k][0], ny = c[1] + DIRS[k][1];
        if (nx < 0 || ny < 0 || nx >= w || ny >= h || seen[nx + ',' + ny]) return;
        seen[nx + ',' + ny] = true; q.push([nx, ny]);
      });
    }
    return null;
  }

  function camera(s, mapW, mapH, vw, vh) {
    var mw = mapW * TILE, mh = mapH * TILE;
    var x = mw <= vw ? (mw - vw) / 2 : clamp(s.px + 8 - vw / 2, 0, mw - vw);
    var y = mh <= vh ? (mh - vh) / 2 : clamp(s.py + 8 - vh / 2, 0, mh - vh);
    return [Math.round(x), Math.round(y)];
  }

  function fit(box, canvas) {
    var r = box.getBoundingClientRect();
    if (!r.width || !r.height) return null;

<script>/* ../../../engine/clock.js */
// Studio clock: runs a game's logic at a steady 60 ticks a second, whatever the phone's screen rate, for every game.
// Walking counts its steps in ticks (engine/move.js: 10 ticks a step), so without this a 120 Hz screen
// walks twice as fast as the iPhone SE's 60 Hz screen, and a 30 Hz one (iPhone Low Power Mode) half as fast.
// Knows nothing about any game.
//
//   var clock = StudioClock.make();
//   function loop(now) {                  // now: the timestamp requestAnimationFrame passes in
//     var n = clock.ticks(now);           // how many 1/60 s ticks have passed since the last frame (0 to 4)
//     if (n) { for (var i = 0; i < n; i++) update(); draw(); }
//     raf = requestAnimationFrame(loop);
//   }
//   clock.reset()                         // call when the loop (re)starts, so time spent away isn't caught up
//
// 60 Hz: one tick every frame, as before. 120 Hz: a tick every other frame, and the frames in between are
// skipped (nothing would change on screen). 90 Hz: two ticks every three frames. 30 Hz: two ticks a frame.
// A long gap (tab hidden, a slow frame) counts as one tick, so the game never jumps ahead.
(function () {
  var STEP = 1000 / 60;   // one tick, in ms
  var SLACK = 3;          // a frame up to 3 ms early still counts, so 60 Hz screens with jitter keep one tick a frame
  var MAX = 4;            // at most 4 ticks per frame (15 Hz)
  var GAP = 250;          // longer than this: count one tick

  function make() {
    var last = null, acc = 0;
    return {
      reset: function () { last = null; acc = 0; },
      ticks: function (now) {
        if (last === null || now - last > GAP || now < last) { last = now; acc = 0; return 1; }
        acc += now - last; last = now;
        var n = Math.min(MAX, Math.floor((acc + SLACK) / STEP));
        acc = Math.max(-SLACK, Math.min(STEP, acc - n * STEP));
        return n;
      }
    };
  }

  window.StudioClock = { STEP: STEP, make: make };
})();

</script>

// Studio seed: seeded random streams whose position can be saved and restored, for every game that builds its world
// or rolls its dice from a seed (studio-bible/saves.md, Seeds: one seed per run; dice from a second stream whose
// position is saved, so reopening rerolls nothing). Set Nov 22, 2026 from Rushlight spec 002. Knows nothing about any game.
//
//   StudioSeed.stream(seed)       a stream made from a whole number. Several can run side by side (a run's world,
//                                 muster and dice streams are separate).
//     s.next()                    the next number from 0 up to (not including) 1, like Math.random
//     s.int(n)                    a whole number from 0 to n - 1
//     s.pos                       how many numbers it has given so far
//     s.save()                    its position as a small plain object {seed, a, n}, safe to put in a save
//   StudioSeed.load(saved)        a stream back exactly where save() left it: the same next numbers follow
//   StudioSeed.hash(text)         a whole number from any text, to make a seed from a typed word
//
// The maths is mulberry32: small, fast and the same in every browser.
(function () {
  function stream(seed, a, n) {
    var s = { seed: seed | 0, a: a == null ? seed | 0 : a | 0, pos: n | 0 };
    s.next = function () {
      s.pos++;
      var t = s.a = (s.a + 0x6D2B79F5) | 0;
      t = Math.imul(t ^ (t >>> 15), 1 | t);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    s.int = function (n) { return Math.floor(s.next() * n); };
    s.save = function () { return { seed: s.seed, a: s.a, n: s.pos }; };
    return s;
  }
  function load(o) { return o ? stream(o.seed, o.a, o.n) : null; }

    var h = 2166136261;
    text = String(text);
    for (var i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h | 0;
  }
  window.StudioSeed = { stream: stream, load: load, hash: hash };
})();

//   StudioParty.next(n, cur, canLead)    the next seat after cur that can lead (seat order, wraps), or cur

//                                        (any true: no). Presses while it can't are ignored, not saved up.
//
//   const list = StudioParty.list({

<script>/* ../../../engine/savecode.js */
// Studio save code: a save turned into one line of text the player copies out and pastes back
// (studio-bible/saves.md: save export and import, because clearing Safari's data wipes saves).
// Set Nov 24, 2026 from Life After spec 001; Black Lantern (BL1:) and Rushlight (RL1:) make the same
// kind of code by hand. Knows nothing about any game.
//
//   StudioCode.make(tag, obj)     'TAG:' plus the object as JSON in base64, safe for any letters (names with accents)
//   StudioCode.read(tag, text)    the object back, or null when the text isn't a good code with that tag.
//                                 Spaces and line breaks the phone adds when pasting are ignored.
(function () {
  function make(tag, obj) {
    return tag + ':' + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
  }
  function read(tag, text) {
    text = String(text || '').replace(/\s+/g, '');
    if (text.indexOf(tag + ':') !== 0) return null;
    try {
      var o = JSON.parse(decodeURIComponent(escape(atob(text.slice(tag.length + 1)))));
      return o && typeof o === 'object' ? o : null;
    } catch (e) { return null; }
  }
  window.StudioCode = { make: make, read: read };
})();

<script>/* game.js */
// Life After, slice part A (spec 001): the title, a new world, the survivor builder, the party card,

(function () {

  var VERSION = 1;

  var STEPS_UP = {};

    var v = store.get('version', null);

    if (v < VERSION) {

      store.set('backup.v' + v, { version: v, run: store.get('run', null), record: store.get('record', null) });
      var run = store.get('run', null), rec = store.get('record', null);

      if (run) store.set('run', run);

    }
  }

  function exportCode() { return StudioCode.make('LA1', { version: store.get('version', VERSION), run: store.get('run', null), record: store.get('record', null) }); }

  }

  // ================= survivor drawing (cached) =================

  }

    return (cache[k] = c);

  // ================= the survivor builder's working copy =================
  var B = null;      // the draft survivor
  var W0 = null;     // the new world's settings: {preset, season, seed, typed}
  var rs = null;     // the builder's dice: made from the world seed, so the same seed and choices give the same survivor
  function blankLooks() { return { body: 1, skin: 1, face: 0, hairStyle: 0, hairColor: 1, colors: 0, age: 0 }; }
  function blank() { return { template: null, name: '', job: null, free: {}, good: [], bad: [], want: null, looks: blankLooks() }; }
  function pick(a) { return a[rs.int(a.length)]; }
  function freeLeft() { var n = 0; for (var k in B.free) n += B.free[k]; return D.FREE - n; }
  function skills() { return D.skillsOf(B.job, B.looks.age, B.free); }
  function useTemplate(t) {

  }

      var need = D.traitSum(good);
