<html><head><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>body{margin:0;background:#1a1a1a;display:flex;gap:24px;padding:20px;font-family:sans-serif;color:#ddd}
.c{display:flex;flex-direction:column;align-items:center;gap:8px}
canvas{image-rendering:pixelated;width:720px;height:600px;border:6px solid #3a3a2e;border-radius:6px}
h2{font-family:'Press Start 2P';font-size:14px;margin:0}</style></head><body>
<div class="c"><h2>A. FIGHT ON THE MAP</h2><canvas id="a" width="240" height="200"></canvas></div>
<div class="c"><h2>B. BATTLE SCREEN</h2><canvas id="b" width="240" height="200"></canvas></div>
<script>
const P={grass:'#4a5a34',grass2:'#56663b',road:'#5b5650',line:'#c9b458',wall:'#7a6248',roof:'#4a2f2a',dark:'#151414',skin:'#c9a27e',zom:'#7f9a6a',zom2:'#5c7450',blood:'#7a1e1e',jacket:'#3e5a7a',jeans:'#2e3a52',ui:'#1c1a18',uiB:'#d8cfb8',txt:'#efe6cf'};
function R(x,c,X,Y,W,H){x.fillStyle=c;x.fillRect(X,Y,W,H)}
function person(x,X,Y,body,legs,head,zombie){
 R(x,P.dark,X+2,Y,10,10);R(x,head,X+3,Y+1,8,8); // head
 R(x,zombie?'#2a3324':'#3a2618',X+3,Y+1,8,3); // hair
 R(x,P.dark,X+5,Y+5,1,1);R(x,P.dark,X+8,Y+5,1,1);
 R(x,P.dark,X+1,Y+10,12,9);R(x,body,X+2,Y+11,10,7);
 if(zombie){R(x,P.blood,X+4,Y+13,3,2);R(x,head,X-2,Y+11,4,3);R(x,head,X+12,Y+11,4,3);} 
 R(x,P.dark,X+2,Y+19,10,6);R(x,legs,X+3,Y+19,3,5);R(x,legs,X+8,Y+19,3,5);
}
// ---------- A: map
let a=document.getElementById('a').getContext('2d');
for(let ty=0;ty<13;ty++)for(let tx=0;tx<15;tx++){R(a,(tx+ty)%3?P.grass:P.grass2,tx*16,ty*16,16,16)}
R(a,P.road,0,96,240,32);for(let i=0;i<240;i+=24)R(a,P.line,i,111,12,2);
// house
R(a,P.roof,16,8,96,30);R(a,P.wall,20,38,88,40);R(a,P.dark,56,54,16,24);R(a,'#8a6a3a',58,56,12,22);
R(a,'#26303a',28,46,16,12);R(a,'#26303a',84,46,16,12);
// boards on window
R(a,'#a08050',26,49,20,3);R(a,'#a08050',82,51,20,3);
// car wreck
R(a,'#6a2a22',150,98,44,18);R(a,'#2b2b2b',156,100,32,7);R(a,P.dark,152,114,8,5);R(a,P.dark,184,114,8,5);
// grid overlay faint
a.globalAlpha=.08;a.strokeStyle='#fff';for(let i=0;i<=240;i+=16){a.beginPath();a.moveTo(i+.5,0);a.lineTo(i+.5,200);a.stroke()}for(let j=0;j<=200;j+=16){a.beginPath();a.moveTo(0,j+.5);a.lineTo(240,j+.5);a.stroke()}a.globalAlpha=1;
// noise ring
a.strokeStyle='#e8d070';a.setLineDash([3,3]);a.beginPath();a.arc(72,102,44,0,7);a.stroke();a.setLineDash([]);
// survivor at tile
person(a,65,86,P.jacket,P.jeans,P.skin,false);
// attack target highlight
a.strokeStyle='#ff5040';a.strokeRect(96.5,80.5,16,16);a.strokeRect(97.5,81.5,14,14);
person(a,97,76,'#6b5a48','#3a3a30',P.zom,true);
person(a,129,132,'#4a4a5a','#3a3a30',P.zom,true);
person(a,193,60,'#5a4a3a','#3a3a30',P.zom2,true);
// zombie next-move arrows
a.fillStyle='#ffb040';function arr(x0,y0,x1,y1){a.strokeStyle='#ffb040';a.beginPath();a.moveTo(x0,y0);a.lineTo(x1,y1);a.stroke();a.fillRect(x1-1,y1-1,3,3)}
arr(136,130,122,122);arr(198,82,182,92);
// HUD top
R(a,'rgba(20,18,16,.85)',0,0,240,14);a.font='8px "Press Start 2P"';a.fillStyle=P.txt;a.fillText('DAY 3  2:40PM',4,10);a.fillStyle='#e05a4a';a.fillText('HP',150,10);R(a,'#e05a4a',168,4,30,5);a.fillStyle='#d8a040';a.fillText('FD',202,10);R(a,'#d8a040',222,4,14,5);
// bottom action box
R(a,P.ui,0,160,240,40);R(a,P.uiB,0,160,240,1);a.font='16px VT323';a.fillStyle=P.txt;
a.fillText('Shambler, 1 tile. Pipe: 70% to hit.',6,174);a.fillText('A Swing  B Back  1 step = 1 turn',6,190);
// ---------- B: battle
let b=document.getElementById('b').getContext('2d');
// background: street at dusk
let g=b.createLinearGradient(0,0,0,110);g.addColorStop(0,'#3a2a3a');g.addColorStop(1,'#8a5a40');b.fillStyle=g;b.fillRect(0,0,240,110);
R(b,'#2a2228',10,40,60,70);R(b,'#2a2228',170,30,60,80);R(b,'#3a3030',80,60,40,50);
R(b,'#d8b050',24,56,6,6);R(b,'#d8b050',190,46,6,6);
R(b,P.road,0,100,240,60);for(let i=0;i<240;i+=30)R(b,P.line,i,128,14,2);
// big zombies (scaled)
b.save();b.scale(3,3);person(b,22,10,'#6b5a48','#3a3a30',P.zom,true);b.restore();
b.save();b.scale(2.4,2.4);person(b,52,16,'#4a4a5a','#3a3a30',P.zom2,true);b.restore();
// survivor from behind
function back(X,Y){R(b,P.dark,X,Y,22,18);R(b,'#3a2618',X+2,Y+2,18,14);R(b,P.dark,X-4,Y+16,30,22);R(b,P.jacket,X-2,Y+18,26,20)}
back(30,124);
// turn order column
R(b,'rgba(20,18,16,.85)',212,4,24,84);b.font='6px "Press Start 2P"';b.fillStyle=P.txt;b.fillText('TURN',213,12);
[[P.skin,'#fff'],[P.zom,''],[P.zom2,'']].forEach((c,i)=>{R(b,P.dark,215,18+i*22,18,18);R(b,c[0],217,20+i*22,14,14);if(c[1]){b.strokeStyle='#fff';b.strokeRect(214.5,17.5+i*22,19,19)}});
// menu
R(b,P.ui,0,148,240,52);R(b,P.uiB,0,148,240,1);b.font='16px VT323';b.fillStyle=P.txt;
b.fillText('▶ Swing pipe     Item',90,166);b.fillText('  Shove          Run',90,184);
b.fillText('YOU',6,166);R(b,'#e05a4a',6,172,60,5);b.fillStyle='#d8a040';R(b,'#d8a040',6,182,40,4);
</script></body></html>
