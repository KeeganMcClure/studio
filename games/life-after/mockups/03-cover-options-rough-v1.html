<!doctype html>
<html><head><meta charset="utf-8"><title>Life After cover options</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block" rel="stylesheet">
<style>
body{margin:0;background:#0c0e10;color:#e8e0c0;font:12px monospace;padding:16px}
.row{display:flex;gap:24px;flex-wrap:wrap}
figure{margin:0}
canvas{width:360px;height:240px;image-rendering:pixelated;display:block;border:2px solid #3a4442}
figcaption{margin-top:8px;max-width:360px;line-height:1.4}
b{color:#e8c88a}
</style></head><body>
<div class="row">
<figure><canvas id="A" width="120" height="80"></canvas><figcaption><b>A. Vacancy.</b> The Starlite sign still glows over an empty highway. Your survivor stands in the flashlight's cone; shapes wait past the light.</figcaption></figure>
<figure><canvas id="B" width="120" height="80"></canvas><figcaption><b>B. Boarded window.</b> Warm light between nailed boards, from inside the hideout. A hand presses on the glass from outside.</figcaption></figure>
<figure><canvas id="C" width="120" height="80"></canvas><figcaption><b>C. First light.</b> An ochre dawn behind a quiet street. Your survivor sits on a dead car with a bat, watching the dead walk home.</figcaption></figure>
</div>
<script>
// Rough cover options for Life After (studio-bible/launcher.md, Covers: 120 x 80, drawn in code, title in Press Start 2P).
// Colors from the baseline frame (mockups/02-baseline-san-rough-v2.html, NIGHT and DAY sets).
const N={sky1:'#1a1e26',sky2:'#3a3a44',ground:'#2a2e2a',ground2:'#32362e',road:'#2e3034',line:'#b8a070',wall:'#4e5a58',wall2:'#3a4442',dark:'#1e2428',out:'#0c0e10',light:'#e8c88a',skin:'#d8a880',skinS:'#8a5a48',red:'#a8502e',redS:'#6a3424',teal:'#46605e',zom:'#9aa080',zomS:'#5e6650',pink:'#ff4fa3',cyan:'#3ff0e8',amber:'#ffb43a',bone:'#e8e0c0'};
function pen(id){const c=document.getElementById(id).getContext('2d');c.imageSmoothingEnabled=false;
 const r=(col,x,y,w,h)=>{c.fillStyle=N[col]||col;c.fillRect(x|0,y|0,w,h)};return {c,r};}
function dither(r,col,x0,y0,x1,y1,test){for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(test(x,y))r(col,x,y,1,1);}
function title(c,y,col,shadow){ // crisp: draw the text off screen, keep only solid pixels
 const o=document.createElement('canvas');o.width=120;o.height=16;const t=o.getContext('2d');
 t.font='8px "Press Start 2P"';t.textBaseline='top';t.textAlign='left';t.fillStyle='#fff';t.fillText('LIFE AFTER',20,4);
 const d=t.getImageData(0,0,120,16).data;
 for(const [dx,dy,cl] of [[1,1,shadow],[0,0,col]])for(let yy=0;yy<16;yy++)for(let xx=0;xx<120;xx++)if(d[(yy*120+xx)*4+3]>110){c.fillStyle=cl;c.fillRect(xx+dx,y-4+yy+dy,1,1);}}
function band(r,y){r('out',0,y,120,80-y);}
function person(r,x,y,o){ // ~7 x 13 standing figure
 o=o||{};r('out',x-1,y-1,9,15);r(o.coat||'teal',x,y+4,7,6);r(o.coatS||'wall2',x+5,y+4,2,6);
 r(o.skin||'skin',x+1,y,5,4);r(o.hair||'redS',x+1,y,5,1);r(o.legs||'dark',x+1,y+10,2,3);r(o.legs||'dark',x+4,y+10,2,3);}
function zombie(r,x,y,lean){ // hunched, one arm out
 r('out',x-1,y-1,8,15);r('zomS',x,y+4,6,6);r('zom',x+1,y+1+lean,4,4);r('zomS',x+1,y+3+lean,4,1);
 r('zom',x+6,y+5,3,1);r('out',x+6,y+4,3,1);r('dark',x+1,y+10,2,3);r('dark',x+4,y+10,1,3);r('redS',x+2,y+6,2,2);}

document.fonts.load('8px "Press Start 2P"').then(()=>{
// A. Vacancy
(function(){const {c,r}=pen('A');
 r('sky1',0,0,120,80);dither(r,'sky2',0,24,120,46,(x,y)=>y>36||(x+y)%2===0&&y>30);
 [[8,6],[30,12],[50,4],[88,9],[110,15],[72,18]].forEach(s=>r('bone',s[0],s[1],1,1));
 r('ground',0,46,120,34);r('road',0,52,120,20);
 for(let x=2;x<120;x+=10)r('line',x,61,5,1);
 // Starlite sign on a pole
 r('dark',88,18,2,30);r('out',72,8,36,14);r('wall2',73,9,34,12);
 c.font='5px monospace';
 for(let i=6;i>0;i--){c.globalAlpha=.06;r('pink',72-i,8-i,36+2*i,14+2*i);}c.globalAlpha=1;
 r('pink',75,11,30,1);r('pink',75,18,30,1);
 c.fillStyle=N.pink;c.font='bold 6px monospace';c.textAlign='center';c.textBaseline='top';c.fillText('STARLITE',90,12);
 r('cyan',94,24,12,5);r('out',95,25,10,3);c.fillStyle=N.cyan;c.font='3px monospace';c.fillText('VACANCY',100,25);
 // motel block, dark
 r('wall2',4,34,60,14);r('dark',4,32,60,2);for(let i=0;i<6;i++){r('out',8+i*9,38,5,7);} r('light',17,39,3,2);
 // flashlight cone from survivor
 const sx=40,sy=48;for(let x=sx+8;x<sx+40;x++){const h=(x-sx-8)*0.35;for(let y=Math.round(sy+7-h);y<sy+8+h;y++)if((x+y)%2===0&&y<66)r('light',x,y,1,1);}
 person(r,sx,sy-2,{coat:'red',coatS:'redS'});r('light',sx+7,sy+5,2,1);
 // shapes past the light
 zombie(r,96,48,0);zombie(r,108,51,1);zombie(r,16,50,1);
 c.globalAlpha=.5;zombie(r,4,46,0);c.globalAlpha=1;
 band(r,66);title(c,69,N.light,N.redS);
})();

// B. Boarded window
(function(){const {c,r}=pen('B');
 r('wall2',0,0,120,80);dither(r,'dark',0,0,120,80,(x,y)=>(x*3+y*7)%11===0);
 // siding lines
 for(let y=4;y<80;y+=6)r('dark',0,y,120,1);
 // window frame
 r('out',28,8,64,50);r('bone',30,10,60,46);r('dark',31,11,58,44);
 // inside glow
 for(let y=12;y<54;y++)for(let x=32;x<88;x++){const d=Math.hypot(x-60,y-34);if(d<14)r('light',x,y,1,1);else if(d<24&&(x+y)%2===0)r('amber',x,y,1,1);else if(d<32&&x%2===0&&y%2===0)r('redS',x,y,1,1);}
 // boards
 [[14,-3],[28,2],[42,-2]].forEach(([y,t])=>{for(let i=0;i<62;i++){const yy=y+Math.round(t*(i-31)/31);r('out',29+i,yy-1,1,9);r('red',29+i,yy,1,7);r('redS',29+i,yy+5,1,2);}
   r('bone',31,y-Math.round(t)+2,1,1);r('bone',87,y+Math.round(t)+2,1,1);});
 // hand on the glass, outside (dark, zombie)
 r('out',70,17,10,13);r('zom',71,20,8,9);[0,2,4,6].forEach(i=>r('zom',71+i,17,1,3));r('zom',79,22,2,1);r('zomS',72,27,6,2);r('redS',74,23,2,2);
 // sill
 r('out',24,58,72,4);r('wall',25,58,70,3);
 r('out',0,64,120,16);
 title(c,69,N.light,N.redS);
})();

// C. First light
(function(){const {c,r}=pen('C');
 const bands=['#3a3a44','#5a4a4c','#8a5a48','#c08a68','#e0b088','#e8c88a'];
 bands.forEach((b,i)=>r(b,0,i*7,120,7));
 for(let i=1;i<bands.length;i++)dither(r,bands[i],0,i*7-2,120,i*7,(x,y)=>(x+y)%2===0);
 r('#f0d8a0',52,34,16,8);r('#efe6cf',55,32,10,4); // sun low
 // houses skyline
 [[0,30,22,14],[24,34,18,10],[78,32,20,12],[100,28,20,16]].forEach(([x,y,w,h])=>{r('dark',x,y,w,h+30);for(let i=0;i<w/2;i++)r('dark',x+i,y-i/2,w-2*i,1);});
 r('dark',44,36,2,10);r('dark',40,36,10,1); // power pole
 r('dark',0,44,120,36);r('road',0,52,120,28);
 // walking dead toward the sun
 [[20,44],[32,46],[64,45],[90,47],[104,45]].forEach(([x,y],i)=>{r('out',x,y,5,11);r('out',x+1,y-3,3,3);r('out',x+5,y+3,3,1);});
 // dead car and survivor on its roof
 r('out',8,58,44,14);r('wall2',9,59,42,9);r('wall',16,54,24,6);r('out',16,53,24,1);r('sky2',18,55,8,4);r('sky2',28,55,10,4);
 r('out',12,68,8,6);r('out',38,68,8,6);r('dark',14,70,4,3);r('dark',40,70,4,3);
 r('out',20,41,8,13);r('teal',21,45,6,5);r('skin',22,42,4,3);r('redS',22,41,4,1);r('dark',21,50,2,4);r('dark',25,50,3,2);
 r('bone',28,38,1,10);r('line',28,38,1,4); // bat over shoulder
 band(r,66);title(c,69,N.bone,N.redS);
})();
});
</script></body></html>
