person(52,108,{hair:'out',skin:'skin',skinS:'skinS',body:'teal',bodyS:'dark',legs:'dark'});

{const d=c.getImageData(0,14,240,168);let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};

 d.data[i]+=n+(L>110?8:-4);d.data[i+1]+=n;d.data[i+2]+=n+(L>110?-8:8);}}c.putImageData(d,0,14);}

R('rgba(5,8,10,.85)',0,0,240,13);c.font='8px "Press Start 2P"';c.fillStyle=P.light;c.fillText(P.neon?'DAY 12  11:20PM':'DAY 13  9:05AM',4,10);
c.fillStyle='#c0463a';c.fillRect(150,4,24,5);c.fillStyle='#e8d8a0';c.fillRect(178,4,16,5);c.fillStyle='#3ff0e8';c.fillRect(198,4,14,5);c.fillStyle='#ff4fa3';c.fillRect(216,4,20,5);
R('rgba(5,8,10,.92)',0,182,240,18);R(P.neon?'cyan':'line',0,182,240,1);c.font='16px VT323';c.fillStyle='#efe6cf';

function mix(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
setTimeout(()=>{draw('N',NIGHT);draw('L',NIGHT);draw('F',NIGHT);drain();phantom()},600);
function drain(){const c=document.getElementById('L').getContext('2d');const d=c.getImageData(0,14,240,168);let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
for(let i=0;i<d.data.length;i+=4){const r=d.data[i],g=d.data[i+1],b=d.data[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const sat=mx-mn;const L=(r+g+b)/3;
 if(sat>110)continue; const n=0;d.data[i]=L*.9+n;d.data[i+1]=L*.9+n;d.data[i+2]=L*.95+n;}
c.putImageData(d,0,14);
// edge jitter: shift a few rows

c.fillStyle='#0c0e10';c.fillRect(0,182,240,18);c.font='16px VT323';c.fillStyle='#d8d0c0';c.fillText('Room 3 is open. Isn\'t it?',6,195);}

c.strokeStyle='#e8c88a';c.setLineDash([2,3]);c.beginPath();c.arc(200,120,26,0,7);c.stroke();c.setLineDash([]);
c.fillStyle='#0c0e10';c.fillRect(0,182,240,18);c.font='16px VT323';c.fillStyle='#d8d0c0';c.fillText('Something moved by the pump.',6,195);}

const d=c.getImageData(0,0,64,64);for(let i=0;i<d.data.length;i+=4){}c.putImageData(d,0,0);}
