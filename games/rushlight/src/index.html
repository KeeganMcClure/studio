<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rushlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a handheld console shell — the screen, then D-pad / L-R over Select-Start / A-B.
   Painted in Rushlight's earth palette (bible Art, Palette; the approved battle mockup's shell: dark leather, Rust A, Blood B). */
:root{
  --shell:#3b3229; --shell-hi:#4d4134; --shell-lo:#2c2621; --bezel:#1c1814;
  --scr-bg:#1c1814; --scr-fg:#e6dcc4; --scr-dim:#857e72; --scr-hi:#d9b45a; --scr-red:#c8603a; --scr-grn:#a8b46a; --scr-line:#4d4134;
  --btn:#1c1814; --btn-hi:#2c2621; --btn-a:#9a4528; --btn-b:#5e1a18; --label:#b3aa98;
  --px:"Press Start 2P", ui-monospace, Menlo, monospace;
  --vt:"VT323", ui-monospace, Menlo, monospace;
  /* shell paint (engine/shell.css) */
  --page:#141210; --brand-ink:#b3aa98; --led:#d9b45a; --led-off:#3a3028; --bezel-edge:#0e0c0a; --btn-ink:#f2ead6;
  color-scheme:dark;
}
</style>
<link rel="stylesheet" href="../../../engine/shell.css">
<style>
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px 6px;font:8px/1.4 var(--px);color:var(--scr-hi);background:#2c2621;border-bottom:2px solid var(--scr-line)}
.hdr #hStep{color:var(--scr-dim)}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.body.side{flex-direction:row}
.list{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 0;scrollbar-width:thin;scrollbar-color:var(--scr-line) transparent}
.pane{flex:none;border-top:2px solid var(--scr-line);padding:7px 10px;color:var(--scr-fg);max-height:42%;overflow-y:auto;background:#231e1a}
.pane:empty{display:none}
.body.side .pane{border-top:0;border-left:2px solid var(--scr-line);max-height:none;width:42%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding-top:12px}
.row{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;cursor:pointer;min-height:26px}
.row .cur{width:12px;flex:none;color:var(--scr-hi);visibility:hidden;font-size:16px}
.row.on{background:#3b3229;outline:2px solid var(--scr-hi);outline-offset:-2px}
.row.on .cur{visibility:visible;animation:bob .6s steps(2) infinite}
.row .lab{flex:1;min-width:0;white-space:normal;overflow-wrap:break-word;line-height:1}
.row .val{flex:none;display:flex;align-items:center;gap:4px;color:var(--scr-hi)}
.row .val b{font-weight:normal;color:var(--scr-dim);padding:0 3px;cursor:pointer}
.row.on .val b{color:var(--scr-fg)}
.row.dim .lab{color:var(--scr-dim)}
.row.lwrap .lab{white-space:normal;overflow:visible;line-height:.95}
.row.two{align-items:flex-start;padding-top:2px;padding-bottom:3px}.row.two .cur{margin-top:1px}.row.two .lab b{font-weight:normal;display:block;line-height:1.05}.row.two .lab b.nm{color:var(--scr-fg)}.row.two .sub{font-size:17px;line-height:1;color:var(--scr-fg)}.row.two+.row.two{margin-top:2px}.row.tpl.two .lab b{text-transform:uppercase;letter-spacing:.03em}.row.tpl.two .sub{font-size:16px}
.row.go .lab{color:var(--scr-grn)}
.row.warn .lab{color:var(--scr-red)}
.row.pickd{background:#2c2621}
.row input{flex:1;min-width:0;font:20px var(--vt);color:var(--scr-fg);background:#141210;border:1px solid var(--scr-line);border-radius:2px;padding:1px 5px;outline:none;-webkit-user-select:text;user-select:text}
.row input:focus{border-color:var(--scr-hi)}
.tag{font:7px var(--px);color:#1c1814;background:var(--scr-red);padding:2px 3px;margin-left:6px;vertical-align:2px}
.tag.mine{background:var(--scr-grn)}
.pip{color:var(--scr-grn);letter-spacing:-1px}
.static{padding:6px 10px;color:var(--scr-fg)}
.static h3{font:8px/1.5 var(--px);color:var(--scr-hi);margin:4px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 8px}
.kv span:nth-child(odd){color:var(--scr-dim)}
/* descriptions and merc lines read in Bone; Ash (--scr-dim) is only for labels, hints and the key help line (ui, Screen craft) */
.small{font-size:17px;color:var(--scr-fg)}.hint{color:var(--scr-dim)}
.hi{color:var(--scr-hi)} .red{color:var(--scr-red)} .grn{color:var(--scr-grn)}
.ftr{padding:5px 9px;font:7px/1.5 var(--px);color:var(--scr-dim);border-top:2px solid var(--scr-line);background:#2c2621;min-height:12px}
.ftr.creep{color:var(--scr-red)}
canvas.pix,img.pix{image-rendering:pixelated;image-rendering:crisp-edges;background:#2c2621;border:2px solid var(--scr-line);max-width:100%}
.logo{font:13px/1.6 var(--px);color:var(--scr-hi);text-align:center;margin:14px 0 6px;letter-spacing:.06em;text-shadow:2px 2px 0 #5e1a18}
.logo small{display:block;font-size:7px;color:var(--scr-dim);letter-spacing:.2em;text-shadow:none}
.lantern{display:block;margin:6px auto 4px}
.card{border:2px solid var(--scr-line);margin:4px 8px 8px;padding:8px;background:#231e1a;color:var(--scr-fg)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .who{min-width:0}
.card .who .n{font:9px/1.5 var(--px);color:var(--scr-hi);word-break:break-word}
.stamp{display:inline-block;font:7px var(--px);color:var(--scr-red);border:1px solid var(--scr-red);padding:2px 4px;transform:rotate(-4deg);margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px}
.squad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 8px 8px}
.squad .m{border:2px solid var(--scr-line);padding:5px;text-align:center;font-size:16px;background:#231e1a;min-width:0}
.squad .m .p{color:var(--scr-hi);font-size:15px;overflow-wrap:anywhere}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);mix-blend-mode:multiply}
/* the shell's scanlines fade over parchment, so the chart and menus don't read as ruled paper (spec 008) */
#game.region~.scan,#game.parch~.scan{opacity:.35}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(94,26,24,.85));opacity:0;transition:opacity .4s}
.toast{position:absolute;left:8px;right:8px;bottom:34px;background:#d9b45a;color:#1c1814;font:8px/1.5 var(--px);padding:6px 8px;border:2px solid #1c1814;opacity:0;transform:translateY(6px);transition:all .18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.screen.glitch .list,.screen.glitch .hdr{animation:jit 2.7s steps(1) infinite}
@keyframes jit{0%,91%,100%{transform:none}92%{transform:translate(2px,-1px)}94%{transform:translate(-3px,1px)}96%{transform:translate(1px,0)}}
@keyframes bob{50%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.screen.glitch .list,.screen.glitch .hdr,.row.on .cur{animation:none}}
#game{position:absolute;inset:0;display:none;overflow:hidden;background:#1c1814}
.screen.gaming #game{display:block}
.screen.gaming .hdr,.screen.gaming .body,.screen.gaming .ftr{display:none}
#gcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.screen.glitch #gcv{animation:jit 2.7s steps(1) infinite}
.gbox{position:absolute;background:rgba(44,38,33,.96);border:2px solid #e6dcc4;box-shadow:0 0 0 2px #1c1814;border-radius:3px;color:#e6dcc4;font:19px/1.08 var(--vt);padding:5px 8px;box-sizing:border-box}
/* Lantern Bust dialog box (dialog.js). Text keeps its 2 px unit; the portrait is drawn at the map's pixel size (--pu = 64 map px, set by the engine). */
#gdlg{position:absolute;inset:0;pointer-events:none}
#gdlg .bld{pointer-events:auto;cursor:pointer}
#gdlg .bld-t{white-space:pre-line}
#gdlg .bld-bust canvas{width:var(--pu,128px);height:var(--pu,128px)}
#gdlg .bld-tab{left:calc(var(--pu,128px) + var(--u) * 5);max-width:calc(100% - var(--pu,128px) - var(--u) * 7)}
#gdlg .bld.np .bld-tab{left:calc(var(--u) * 3);max-width:calc(100% - var(--u) * 6)}
#gdlg .bld-c{overflow-y:auto;scrollbar-width:none}
#gdlg .bld-c li{cursor:pointer}
#game.battle #gdlg .bld{top:calc(var(--u) * 2);bottom:auto}
/* Rushlight's dialog colors (spec 001), from the earth palette, the same slots shared-ui-dialog-v1 reads: Soot box, Bone border and speech, Tallow name, ▼ and cursor.
   dialog.js stays an unchanged copy of Black Lantern's, so these rules repaint it; the #gdlg prefix makes them win over its own. Narration, prompt and highlighted row are stand-ins until the Designer picks. */
#gdlg .bld{background:rgba(44,38,33,.94);border-color:#e6dcc4;box-shadow:0 0 0 var(--u) #1c1814;color:#e6dcc4}
#gdlg .bld-bust{border-color:#e6dcc4;box-shadow:0 0 0 var(--u) #1c1814}
#gdlg .bld-tab{background:#2c2621;border-color:#e6dcc4;border-bottom-color:#2c2621;color:#d9b45a}
#gdlg .bld.narr .bld-t{color:#e6dcc4}
#gdlg .bld-q{color:#e6dcc4}
#gdlg .bld-c li.on{background:#1c1814}
#gdlg .bld-more rect,#gdlg .bld-cur rect{fill:#d9b45a}
#gmenu{right:6px;bottom:6px;min-width:52%;max-width:calc(100% - 12px);max-height:62%;overflow-y:auto;padding:4px 6px}
#gmenu .mt{font:7px/1.6 var(--px);color:var(--scr-hi);margin:0 0 2px 2px}
#gmenu .gi{display:flex;gap:4px;padding:1px 2px;cursor:pointer;white-space:normal;overflow-wrap:break-word}  /* a row too wide for the box wraps, never cut (bug batch, Nov 24) */
#gmenu .gi .gc{width:12px;color:var(--scr-hi);flex:none}
#gmenu .gi.on{background:#1c1814}
#gmenu .gi.dis{color:#857e72}
#gmenu .gic{width:12px;height:12px;image-rendering:pixelated;margin:3px 2px 0 0;flex:none}
#gmenu .md{font-size:16px;color:var(--scr-fg);border-top:1px solid #4d4134;margin-top:3px;padding-top:2px;white-space:normal}
#ghud{position:absolute;left:4px;right:4px;bottom:4px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
#ghud.shake{animation:jit .25s steps(1)}
.hb{background:rgba(13,19,34,.94);border:2px solid #7c86a6;border-radius:3px;padding:2px 4px;font:16px/1 var(--vt);color:#ebe5c8;min-width:0;overflow:hidden}
.hb.on{border-color:var(--scr-hi);transform:translateY(-3px)}
.hb.ko{opacity:.5;border-color:var(--scr-red)}
.hb .nm{font:6px/1.6 var(--px);color:var(--scr-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{font-weight:normal;color:var(--scr-hi)} .hb .red,.gbox .red{color:var(--scr-red)} .hb .sn{color:#b9aee8}
#gsan{left:6px;top:6px;padding:1px 6px;font:7px/1.8 var(--px);border-width:1px}
#gsan b{font-weight:normal;color:var(--scr-hi)}
#game.battle #gsan,#game.menu #gsan,#game.region #gsan,#game.site #gsan,#game.town #gsan{display:none}
#game.site .gban,#game.town .gban{top:40px}
.gban{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:8px/1.6 var(--px);color:var(--scr-hi);background:rgba(28,24,20,.92);border:1px solid var(--scr-hi);padding:3px 8px;white-space:nowrap}
#gfade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .32s}
/* Pick a company seat cards and the Muster roll (spec 003; Mockup 6) */
.row.tpl{min-height:18px;padding:1px 9px 1px 4px;font-size:17px}.row.tpl .val{font-size:14px}.row.seatrow .val{display:none}.row.seatrow{padding:2px 4px 2px 0}.row.seatrow .lab{white-space:normal}.row.seatrow .cur{display:none}
.seat{display:flex;gap:7px;padding:4px 6px;background:#231e1a;border:1px solid #4d4134;font-size:16px;line-height:1;min-width:0}
.row.on .seat{border:2px solid var(--scr-hi)}.seat.kept{border-left:4px solid var(--scr-hi)}.seat i{color:var(--scr-hi);font-style:normal}
.seat b{color:var(--scr-hi);font-weight:normal}.seat span,.seat .dim{color:var(--scr-fg)}.seat .si{min-width:0;flex:1}.seat .si>div{white-space:normal;overflow-wrap:break-word}
.seat .bk{color:var(--scr-fg);font-style:italic}.seat.empty{color:#857e72;justify-content:space-between;padding:10px 8px}
.seat canvas,.mpane canvas,.muster canvas{image-rendering:pixelated;outline:1px solid #857e72;flex:none;background:#2c2621}
.acts{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}.acts em{font:7px/14px var(--px);font-style:normal;padding:0 4px;border:1px solid #5a5048;color:#b3aa98;cursor:pointer}.acts em.on{background:var(--scr-hi);color:#1c1814;border-color:var(--scr-hi)}
.mpane{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.muster{color:var(--scr-fg);font-size:17px;line-height:1.05;display:grid;gap:3px}.muster .mh{display:flex;gap:8px;align-items:flex-start}.muster .mh>div{flex:1}
.muster b{font-weight:normal;color:var(--scr-hi)}.seedtag{font:7px var(--px);color:#857e72}.muster .bk{color:var(--scr-fg);font-style:italic}
.kv6{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}.kv6 span{border:1px solid #4d4134;text-align:center;color:#b3aa98;font-size:15px}.kv6 b{display:block;font-size:18px}
#gexport{left:6px;right:6px;top:6px;padding:4px 6px}#gexport textarea{width:100%;height:120px;box-sizing:border-box;font:12px ui-monospace,monospace;background:#141210;color:#e6dcc4;border:1px solid #4d4134;word-break:break-all}
#gexport .mt{font:7px/1.6 var(--px);color:var(--scr-hi)}#gexport .gi{display:flex;gap:4px;padding:1px 2px;cursor:pointer}#gexport .gi.on{background:#1c1814}#gexport .gc{width:12px;color:var(--scr-hi)}

</style>

<!-- The shell around this screen (bezel, brand strip, buttons) comes from engine/shell.js -->
<div class="screen" id="screen" data-brand="RUSHLIGHT" data-brand-sub="THE WITHY MARCH" data-label-l="L" data-label-r="R" data-label-start="Start: menu">
  <div class="hdr"><span id="hTitle"></span><span id="hStep"></span></div>
  <div class="body" id="body"><div class="list" id="list"></div><div class="pane" id="pane"></div></div>
  <div class="ftr" id="ftr"></div>
  <div id="game"><canvas id="gcv" width="240" height="160"></canvas><div class="gbox" id="gsan" hidden></div><div class="gban" id="gban" hidden></div><div id="gdlg"></div><div class="gbox" id="gmenu" hidden></div><div id="ghud" hidden></div><div id="gfade"></div></div>
  <div class="vig" id="vig"></div>
  <div class="scan"></div>
  <div class="toast" id="toast"></div>
</div>
