<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rushlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a handheld console shell — a scrolling CRT screen, then D-pad / L-R over Select-Start / A-B. Single dark look by choice. */
:root{
  --shell:#3a2e78; --shell-hi:#5242a0; --shell-lo:#221a4c; --bezel:#14111f;
  --scr-bg:#0d1322; --scr-fg:#ebe5c8; --scr-dim:#7c86a6; --scr-hi:#ffd166; --scr-red:#ff5d73; --scr-grn:#7fe0a3; --scr-line:#1f2a44;
  --btn:#1c1733; --btn-hi:#2d2650; --btn-a:#c23a5c; --btn-b:#8c2c4a; --label:#b9aee8;
  --px:"Press Start 2P", ui-monospace, Menlo, monospace;
  --vt:"VT323", ui-monospace, Menlo, monospace;
  /* shell paint (engine/shell.css) */
  --page:#100c22; --brand-ink:#5d5888; --led:#3dff8a; --led-off:#3a3a48; --bezel-edge:#0a0812; --btn-ink:#ffe3ec;
  color-scheme:dark;
}
</style>
<link rel="stylesheet" href="../../../engine/shell.css">
<style>
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px 6px;font:8px/1.4 var(--px);color:var(--scr-hi);background:#141c33;border-bottom:2px solid var(--scr-line)}
.hdr #hStep{color:var(--scr-dim)}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.body.side{flex-direction:row}
.list{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 0;scrollbar-width:thin;scrollbar-color:var(--scr-line) transparent}
.pane{flex:none;border-top:2px solid var(--scr-line);padding:7px 10px;color:var(--scr-fg);max-height:42%;overflow-y:auto;background:#0f172b}
.pane:empty{display:none}
.body.side .pane{border-top:0;border-left:2px solid var(--scr-line);max-height:none;width:42%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding-top:12px}
.row{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;cursor:pointer;min-height:26px}
.row .cur{width:12px;flex:none;color:var(--scr-hi);visibility:hidden;font-size:16px}
.row.on{background:#1a2440}
.row.on .cur{visibility:visible;animation:bob .6s steps(2) infinite}
.row .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{flex:none;display:flex;align-items:center;gap:4px;color:var(--scr-hi)}
.row .val b{font-weight:normal;color:var(--scr-dim);padding:0 3px;cursor:pointer}
.row.on .val b{color:var(--scr-fg)}
.row.dim .lab{color:var(--scr-dim)}
.row.wrap .lab{white-space:normal;overflow:visible;line-height:.95}
.row.go .lab{color:var(--scr-grn)}
.row.warn .lab{color:var(--scr-red)}
.row.pickd{background:#2a2140}
.row input{flex:1;min-width:0;font:20px var(--vt);color:var(--scr-fg);background:#0a1020;border:1px solid var(--scr-line);border-radius:2px;padding:1px 5px;outline:none;-webkit-user-select:text;user-select:text}
.row input:focus{border-color:var(--scr-hi)}
.tag{font:7px var(--px);color:#0d1322;background:var(--scr-red);padding:2px 3px;margin-left:6px;vertical-align:2px}
.tag.mine{background:var(--scr-grn)}
.pip{color:var(--scr-grn);letter-spacing:-1px}
.static{padding:6px 10px;color:var(--scr-dim)}
.static h3{font:8px/1.5 var(--px);color:var(--scr-hi);margin:4px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 8px}
.kv span:nth-child(odd){color:var(--scr-dim)}
.small{font-size:17px;color:var(--scr-dim)}
.hi{color:var(--scr-hi)} .red{color:var(--scr-red)} .grn{color:var(--scr-grn)}
.ftr{padding:5px 9px;font:7px/1.5 var(--px);color:var(--scr-dim);border-top:2px solid var(--scr-line);background:#141c33;min-height:12px}
.ftr.creep{color:var(--scr-red)}
canvas.pix,img.pix{image-rendering:pixelated;image-rendering:crisp-edges;background:#16203a;border:2px solid var(--scr-line);max-width:100%}
.logo{font:13px/1.6 var(--px);color:var(--scr-hi);text-align:center;margin:14px 0 6px;letter-spacing:.06em;text-shadow:2px 2px 0 #6b2d4a}
.logo small{display:block;font-size:7px;color:var(--scr-dim);letter-spacing:.2em;text-shadow:none}
.lantern{display:block;margin:6px auto 4px}
.card{border:2px solid var(--scr-line);margin:4px 8px 8px;padding:8px;background:#0f172b;color:var(--scr-fg)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .who{min-width:0}
.card .who .n{font:9px/1.5 var(--px);color:var(--scr-hi);word-break:break-word}
.stamp{display:inline-block;font:7px var(--px);color:var(--scr-red);border:1px solid var(--scr-red);padding:2px 4px;transform:rotate(-4deg);margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px}
.squad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 8px 8px}
.squad .m{border:2px solid var(--scr-line);padding:5px;text-align:center;font-size:16px;background:#0f172b;min-width:0}
.squad .m .p{color:var(--scr-hi);font-size:15px;overflow-wrap:anywhere}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(60,0,10,.85));opacity:0;transition:opacity .4s}
.toast{position:absolute;left:8px;right:8px;bottom:34px;background:#ffd166;color:#0d1322;font:8px/1.5 var(--px);padding:6px 8px;border:2px solid #0d1322;opacity:0;transform:translateY(6px);transition:all .18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.screen.glitch .list,.screen.glitch .hdr{animation:jit 2.7s steps(1) infinite}
@keyframes jit{0%,91%,100%{transform:none}92%{transform:translate(2px,-1px)}94%{transform:translate(-3px,1px)}96%{transform:translate(1px,0)}}
@keyframes bob{50%{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.screen.glitch .list,.screen.glitch .hdr,.row.on .cur{animation:none}}
#game{position:absolute;inset:0;display:none;overflow:hidden;background:#05040a}
.screen.gaming #game{display:block}
.screen.gaming .hdr,.screen.gaming .body,.screen.gaming .ftr{display:none}
#gcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.screen.glitch #gcv{animation:jit 2.7s steps(1) infinite}
.gbox{position:absolute;background:rgba(13,19,34,.94);border:2px solid #ebe5c8;box-shadow:0 0 0 2px #0d1322;border-radius:3px;color:#ebe5c8;font:19px/1.08 var(--vt);padding:5px 8px;box-sizing:border-box}
/* Lantern Bust dialog box (dialog.js). Text keeps its 2 px unit; the portrait is drawn at the map's pixel size (--pu = 64 map px, set by the engine). */
#gdlg{position:absolute;inset:0;pointer-events:none}
#gdlg .bld{pointer-events:auto;cursor:pointer}
#gdlg .bld-t{white-space:pre-line}
#gdlg .bld-bust canvas{width:var(--pu,128px);height:var(--pu,128px)}
#gdlg .bld-tab{left:calc(var(--pu,128px) + var(--u) * 5);max-width:calc(100% - var(--pu,128px) - var(--u) * 7)}
#gdlg .bld.np .bld-tab{left:calc(var(--u) * 3);max-width:calc(100% - var(--u) * 6)}
#gdlg .bld-c{overflow-y:auto;scrollbar-width:none}
#gdlg .bld-c li{cursor:pointer}
#game.battle #gdlg .bld{top:calc(var(--u) * 2);bottom:auto}
/* Rushlight's dialog colors (spec 001), from the earth palette, the same slots shared-ui-dialog-v1 reads: Soot box, Bone border and speech, Tallow name, ▼ and cursor.
   dialog.js stays an unchanged copy of Black Lantern's, so these rules repaint it; the #gdlg prefix makes them win over its own. Narration, prompt and highlighted row are stand-ins until the Designer picks. */
#gdlg .bld{background:rgba(44,38,33,.94);border-color:#e6dcc4;box-shadow:0 0 0 var(--u) #1c1814;color:#e6dcc4}
#gdlg .bld-bust{border-color:#e6dcc4;box-shadow:0 0 0 var(--u) #1c1814}
#gdlg .bld-tab{background:#2c2621;border-color:#e6dcc4;border-bottom-color:#2c2621;color:#d9b45a}
#gdlg .bld.narr .bld-t{color:#857e72}
#gdlg .bld-q{color:#857e72}
#gdlg .bld-c li.on{background:#1c1814}
#gdlg .bld-more rect,#gdlg .bld-cur rect{fill:#d9b45a}
#gmenu{right:6px;bottom:6px;min-width:52%;max-width:calc(100% - 12px);max-height:62%;overflow-y:auto;padding:4px 6px}
#gmenu .mt{font:7px/1.6 var(--px);color:var(--scr-hi);margin:0 0 2px 2px}
#gmenu .gi{display:flex;gap:4px;padding:1px 2px;cursor:pointer;white-space:nowrap}
#gmenu .gi .gc{width:12px;color:var(--scr-hi);flex:none}
#gmenu .gi.on{background:#1a2440}
#gmenu .gi.dis{color:#5d6680}
#gmenu .md{font-size:16px;color:var(--scr-dim);border-top:1px solid #2a3554;margin-top:3px;padding-top:2px;white-space:normal}
#ghud{position:absolute;left:4px;right:4px;bottom:4px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
#ghud.shake{animation:jit .25s steps(1)}
.hb{background:rgba(13,19,34,.94);border:2px solid #7c86a6;border-radius:3px;padding:2px 4px;font:16px/1 var(--vt);color:#ebe5c8;min-width:0;overflow:hidden}
.hb.on{border-color:var(--scr-hi);transform:translateY(-3px)}
.hb.ko{opacity:.5;border-color:var(--scr-red)}
.hb .nm{font:6px/1.6 var(--px);color:var(--scr-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{font-weight:normal;color:var(--scr-hi)} .hb .red,.gbox .red{color:var(--scr-red)} .hb .sn{color:#b9aee8}
#gsan{left:6px;top:6px;padding:1px 6px;font:7px/1.8 var(--px);border-width:1px}
#gsan b{font-weight:normal;color:var(--scr-hi)}
#game.battle #gsan{display:none}
.gban{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:8px/1.6 var(--px);color:var(--scr-hi);background:rgba(13,19,34,.9);border:1px solid var(--scr-hi);padding:3px 8px;white-space:nowrap}
#gfade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .32s}

</style>

<!-- The shell around this screen (bezel, brand strip, buttons) comes from engine/shell.js -->
<div class="screen" id="screen" data-brand="RUSHLIGHT" data-brand-sub="DOT MATRIX" data-label-l="L: previous step" data-label-r="R: next step" data-label-start="Start: jump to dossier">
  <div class="hdr"><span id="hTitle"></span><span id="hStep"></span></div>
  <div class="body" id="body"><div class="list" id="list"></div><div class="pane" id="pane"></div></div>
  <div class="ftr" id="ftr"></div>
  <div id="game"><canvas id="gcv" width="240" height="160"></canvas><div class="gbox" id="gsan" hidden></div><div class="gban" id="gban" hidden></div><div id="gdlg"></div><div class="gbox" id="gmenu" hidden></div><div id="ghud" hidden></div><div id="gfade"></div></div>
  <div class="vig" id="vig"></div>
  <div class="scan"></div>
  <div class="toast" id="toast"></div>
</div>

<script src="../../../engine/studio.js"></script>
<script src="../../../engine/shell.js"></script>
<script src="../../../engine/input.js"></script>
<script src="../../../engine/move.js"></script>
<script src="../../../engine/clock.js"></script>
<script src="strings.js"></script>
<script src="creator.js"></script>
<script src="../../../engine/shelf.js"></script>
<script src="agent-sprite.js"></script>
<script src="../../../engine/dialog.js"></script>
<script src="engine.js"></script>
<script src="content/stub.js"></script>


</body></html>
