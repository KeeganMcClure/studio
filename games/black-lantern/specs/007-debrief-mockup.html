<title>Debrief Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
/* Layout: phone frames stacked in play order, each a 375x667 iPhone SE GBA shell with a caption. Single dark look on purpose. */
:root{
  --page:#0e1020; --shell:#34305c; --bezel:#14121e; --screen:#1b1f33;
  --panel:#1f2440; --panel-hi:#2a2f52; --panel-lo:#14172a; --line:#5a5070;
  --cream:#e8dcc0; --gold:#f4c96a; --mustard:#d6a43a; --lav:#b9a8e0; --dim:#9a92c8;
  --pink:#ff4fa3; --cyan:#3ff0e8; --rust:#b5532e;
  --px:'Press Start 2P',ui-monospace,Menlo,monospace; --vt:'VT323',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body{background:var(--page);color:var(--cream);font-family:var(--vt);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--px);font-size:13px;line-height:1.6;color:var(--gold);margin:0;letter-spacing:.04em}
.intro{font-size:20px;line-height:1.15;color:var(--lav);margin:0}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
figcaption{font-size:19px;line-height:1.15;color:var(--cream);max-width:375px}
figcaption b{font-family:var(--px);font-size:9px;color:var(--gold);font-weight:400;letter-spacing:.05em;display:block;margin-bottom:4px}
@media (max-width:400px){.phone{zoom:.9}}

/* shell */
.phone{position:relative;width:375px;height:667px;overflow:hidden;background:var(--shell);color:var(--cream);font-family:var(--vt);flex:none;border-radius:6px}
.phone .topbar{position:absolute;left:0;right:0;top:0;height:4px;background:#4a4380}
.phone .bezel{position:absolute;left:7px;top:10px;width:361px;height:466px;background:var(--bezel);border-radius:10px 10px 28px 10px}
.scr{position:absolute;left:17px;top:22px;width:340px;height:442px;overflow:hidden;background:var(--screen);box-sizing:border-box}
.scr.pad{padding:6px;display:flex;flex-direction:column;gap:5px}
.brand{position:absolute;left:0;right:0;top:482px;display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--px);font-size:9px;letter-spacing:1px;color:var(--dim)}
.brand i{width:6px;height:6px;background:var(--mustard);box-shadow:0 0 6px var(--mustard)}
.dpad{position:absolute;left:25px;top:508px;width:106px;height:106px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr)}
.dpad span{background:#1a1824;color:#4a4560;font-size:12px;display:grid;place-items:center}
.btn{position:absolute;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--px);font-size:14px}
.btn.b{left:228px;top:548px;background:#6e2e24;box-shadow:inset 0 -4px 0 #4a1e18,0 2px 0 #241f40;color:#e8c8b8}
.btn.a{left:294px;top:516px;background:var(--rust);box-shadow:inset 0 -4px 0 #7a3520,0 2px 0 #241f40;color:#fbe8d8}
.pills{position:absolute;left:0;right:0;top:626px;display:flex;justify-content:center;gap:14px}
.pills span{height:26px;border-radius:13px;background:#1a1824;color:var(--dim);font-family:var(--px);font-size:7px;display:grid;place-items:center;width:72px}
.pills span.lr{width:54px;background:#24213c;font-size:9px}

/* shared UI pieces, matching the creator mockups */
.hdr{display:flex;align-items:center;justify-content:space-between;height:26px;padding:0 8px;background:var(--panel-lo);border:2px solid var(--cream);border-radius:3px;flex:none}
.hdr .t{font-family:var(--px);font-size:9px;color:var(--gold)}
.hdr .s{font-size:15px;color:var(--lav)}
.row{display:flex;align-items:center;gap:6px;min-height:30px;padding:2px 6px;background:var(--panel);border:2px solid var(--line);border-radius:3px;box-sizing:border-box}
.row.on{background:var(--panel-hi);border-color:var(--mustard)}
.row .cur{width:10px;color:var(--gold);font-size:16px;flex:none}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column}
.row .n{font-size:18px;line-height:15px}
.row.on .n{color:var(--gold)}
.row .sub{font-size:14px;line-height:12px;color:var(--lav)}
.chip{font-family:var(--px);font-size:7px;padding:4px 5px 3px;border-radius:2px;flex:none;letter-spacing:.03em}
.chip.bag{background:#2e3a5e;color:var(--cream)}
.chip.keep{background:#3a3424;color:var(--mustard)}
.chip.hide{background:#4a1e38;color:var(--pink);box-shadow:0 0 0 1px var(--pink)}
.odds{font-size:20px;color:var(--cream);flex:none;font-variant-numeric:tabular-nums}
.row.on .odds{color:var(--gold)}
.weak{color:var(--dim)}
.detail{box-sizing:border-box;background:var(--panel);border:3px solid var(--cream);border-radius:3px;padding:5px 8px;display:flex;flex-direction:column;gap:2px;font-size:17px;line-height:16px}
.detail .help{color:var(--lav)}
.unn{color:var(--pink)}
.pin{width:7px;height:9px;flex:none}
canvas.pxl{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* screen 1 */
.wrapup{position:absolute;left:6px;right:6px;top:6px;background:rgba(13,19,34,.94);border:2px solid var(--cream);box-shadow:0 0 0 2px #05040a;border-radius:2px;padding:6px 8px 7px;display:flex;flex-direction:column;gap:5px}
.wrapup .top{display:flex;justify-content:space-between;align-items:baseline}
.wrapup .top .t{font-family:var(--px);font-size:9px;color:var(--gold)}
.wrapup .top .s{font-size:16px;color:var(--lav)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:18px;line-height:16px}
.stats span b{font-weight:400;color:var(--gold);font-variant-numeric:tabular-nums}
.sanrow{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:5px}
.sanrow div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:15px;line-height:14px;color:var(--lav)}
.sanrow div b{font-weight:400;font-size:19px;color:var(--pink);font-variant-numeric:tabular-nums}

/* screen 3 */
.steps{display:flex;gap:3px;flex:none}
.steps span{flex:1;text-align:center;font-family:var(--px);font-size:6px;padding:5px 0 4px;background:var(--panel-lo);color:var(--dim);border:1px solid var(--line);border-radius:2px}
.steps span.lit{background:#4a2418;color:#ffd0b0;border-color:var(--rust)}
.label{font-family:var(--px);font-size:7px;color:var(--lav);letter-spacing:.05em;padding:2px 2px 0}
.who{display:flex;gap:5px}
.who .a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0 3px;background:var(--panel);border:2px solid var(--line);border-radius:3px}
.who .a.on{border-color:var(--mustard);background:var(--panel-hi)}
.who .a .nm{font-size:16px;line-height:14px}
.who .a.on .nm,.who .a.on .pc{color:var(--gold)}
.who .a .pc{font-size:19px;line-height:15px;font-variant-numeric:tabular-nums}
.who .a .sk{font-size:13px;line-height:11px;color:var(--lav)}

/* screen 4 */
.agent{display:flex;gap:7px;padding:5px;background:var(--panel);border:2px solid var(--line);border-radius:3px}
.agent .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.agent .nm{font-size:19px;line-height:15px;color:var(--cream);display:flex;justify-content:space-between}
.agent .nm small{font-size:14px;color:var(--lav)}
.gain{display:flex;align-items:center;gap:6px;font-size:17px;line-height:15px;font-variant-numeric:tabular-nums}
.gain .sk{flex:1}
.gain .die{font-family:var(--px);font-size:6px;background:#2e3a5e;color:var(--cyan);padding:3px 4px 2px;border-radius:2px}
.gain .up{color:var(--gold)}
.unlock{font-family:var(--px);font-size:6px;color:#1b1f33;background:var(--gold);align-self:flex-start;padding:3px 4px 2px;border-radius:2px;letter-spacing:.04em}
.none{font-size:15px;color:var(--dim)}
</style>

<div class="wrap">
  <h1>DEBRIEF AND CASE GAINS</h1>
  <p class="intro">Still mockup at iPhone SE size, inside the GBA shell. Four screens in the order they play after a case closes. Names, items and numbers are placeholders.</p>

  <figure>
    <div class="phone" id="p1"></div>
    <figcaption><b>1 · BIG HAT'S DEBRIEF</b>The donut-shop back room, with the case wrap-up card on top: clues found, victims saved and SAN lost per agent. Big Hat talks over it in the Lantern Bust box.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="p2"></div>
    <figcaption><b>2 · BAG OR HIDE</b>Case-only items in the standard item rows with the pin icon. Ordinary ones are kept as trophies; unnatural ones get bagged. A on an unnatural item flips it to Hide, then asks "Can't be undone. Sure?"</figcaption>
  </figure>

  <figure>
    <div class="phone" id="p3"></div>
    <figcaption><b>3 · COVER STORY</b>The overstepping track sits on top. Each story shows its best odds; the weak one rolls Luck. Below, pick who tells it, with each agent's chance for the highlighted story.</figcaption>
  </figure>

  <figure>
    <div class="phone" id="p4"></div>
    <figcaption><b>4 · CASE GAINS</b>Every skill an agent tried and failed rolls +1d4%, with the die shown. Crossing 40, 75 or 90 flashes the new unlock. Then on to home scenes.</figcaption>
  </figure>
</div>

/* ---- Lantern Bust dialog box, copied from the Asset Library (dialog.js, chosen Nov 15) ---- */
const BLD=(()=>{
const C={box:'rgba(13,19,34,.94)',boxSolid:'#0d1322',edge:'#ebe5c8',ring:'#05040a',text:'#ebe5c8',name:'#ffd166',narr:'#b9aee8',prompt:'#9a93c4',cursorBg:'#22305a'};
const F={px:'"Press Start 2P",ui-monospace,Menlo,monospace',vt:'"VT323",ui-monospace,Menlo,monospace'};
const U=n=>`calc(var(--u) * ${n})`;
const CSS=`
.bld{--u:2px;position:absolute;left:${U(2)};right:${U(2)};bottom:${U(2)};box-sizing:border-box;background:${C.box};border:var(--u) solid ${C.edge};box-shadow:0 0 0 var(--u) ${C.ring};border-radius:var(--u);padding:${U(4)} ${U(5)} ${U(7)};color:${C.text};font:${U(9.5)}/1 ${F.vt};text-align:left;-webkit-font-smoothing:none}
.bld-bust{position:absolute;left:${U(2)};bottom:100%;margin-bottom:calc(var(--u) * -1);border:var(--u) solid ${C.edge};box-shadow:0 0 0 var(--u) ${C.ring};line-height:0}
.bld-bust canvas{display:block;width:${U(64)};height:${U(64)};image-rendering:pixelated;image-rendering:crisp-edges}
.bld-tab{position:absolute;bottom:100%;margin-bottom:calc(var(--u) * -1);left:${U(69)};max-width:calc(100% - ${U(71)});box-sizing:border-box;background:${C.boxSolid};border:var(--u) solid ${C.edge};border-bottom-color:${C.boxSolid};padding:${U(3)} ${U(3)} ${U(2.5)};font:${U(4)}/1 ${F.px};letter-spacing:.04em;color:${C.name};white-space:nowrap;overflow:hidden}
.bld.np .bld-tab{left:${U(3)};max-width:calc(100% - ${U(6)})}
.bld-t{margin:0;min-height:${U(28.5)};overflow-wrap:break-word}
.bld.narr .bld-t{color:${C.narr}}
.bld-q{min-height:0;color:${C.prompt}}
.bld-c{list-style:none;margin:${U(1)} 0 0;padding:0;display:grid;gap:${U(1)}}
.bld-c li{position:relative;padding:${U(1)} ${U(2)} ${U(1)} ${U(7)}}
.bld-c li.on{background:${C.cursorBg}}
.bld-cur{position:absolute;left:${U(2)};top:50%;margin-top:${U(-2.5)};width:${U(3)};height:${U(5)};display:block}
.bld-more{position:absolute;right:${U(4)};bottom:${U(3)};width:${U(5)};height:${U(3)};display:block}`;
function css(){if(document.getElementById('bld-css'))return;const s=document.createElement('style');s.id='bld-css';s.textContent=CSS;document.head.append(s)}
const svg=(cls,w,h,rects)=>`<svg class="${cls}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${rects.map(([x,y,a,b])=>`<rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${C.name}"/>`).join('')}</svg>`;
const MORE=svg('bld-more',5,3,[[0,0,5,1],[1,1,3,1],[2,2,1,1]]);
const CUR=svg('bld-cur',3,5,[[0,0,1,5],[1,1,1,3],[2,2,1,1]]);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function render(host,s){
  css();const b=el('div','bld'+(s.portrait?'':' np')+(s.narrate?' narr':''));b.style.setProperty('--u',(s.scale||2)+'px');
  if(s.portrait){const f=el('div','bld-bust'),c=el('canvas');c.width=c.height=64;s.portrait(c.getContext('2d'),s.mouth?1:0);f.append(c);b.append(f)}
  if(s.name&&!s.narrate)b.append(el('span','bld-tab',s.name.toUpperCase()));
  if(s.choices){if(s.text)b.append(el('p','bld-t bld-q',s.text));const ul=el('ul','bld-c');s.choices.forEach((t,i)=>{const li=el('li',i===s.sel?'on':'',t);if(i===s.sel)li.insertAdjacentHTML('afterbegin',CUR);ul.append(li)});b.append(ul)}
  else{b.append(el('p','bld-t',s.text))}
  if(s.more)b.insertAdjacentHTML('beforeend',MORE);
  host.append(b);return b;
}
return{render};
})();

/* ---- placeholder Storybook faces, 32 x 32 ---- */
function drawFace(c,o){
  const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  r(0,0,32,32,'#2b2a35');r(0,26,32,6,'#25242e');

  r(7,27,18,5,o.shirt);r(6,29,20,3,o.shirt);r(7,27,3,5,o.shirtL);r(13,26,6,2,o.skinD);r(14,27,4,2,o.collar);
  // head
  for(let y=6;y<=25;y++){let hw=y<9?4+(y-6):y<20?8:Math.max(3,8-(y-19));
    r(16-hw,y,hw*2,1,o.skin);r(16+hw-2,y,2,1,o.skinS)}
  r(13,24,6,2,o.skinS);
  // hair
  r(8,4,16,4,o.hair);r(7,6,18,4,o.hair);r(9,3,14,1,o.hairD);r(10,5,6,1,o.hairL);
  r(7,8,2,o.long?17:5,o.hair);r(23,8,2,o.long?17:5,o.hair);r(24,8,1,o.long?17:5,o.hairD);
  if(o.fringe)r(9,9,9,2,o.hair);
  if(o.bun){r(12,0,8,4,o.hair);r(13,0,4,1,o.hairL)}
  // brows
  r(10,11,4,1,o.hairD);r(18,11,4,1,o.hairD);
  // eyes: whites, iris, pupil, glint, lashes
  [[10,13],[18,13]].forEach(([x,y])=>{r(x,y,4,3,'#f4efe4');r(x+1,y,2,3,o.iris);r(x+2,y+1,1,1,'#14101a');r(x+1,y,1,1,'#ffffff');r(x-1,y-1,5,1,'#1a1214')});
  // nose, cheeks, freckles
  r(16,17,1,2,o.skinS);r(9,18,2,1,'#e08a8a');r(21,18,2,1,'#e08a8a');
  if(o.freckles)[[11,17],[13,18],[19,18],[21,17]].forEach(([x,y])=>r(x,y,1,1,o.skinD));
  // mouth
  if(o.mouth==='open'){r(13,20,6,3,'#3a0e0c');r(14,20,4,1,'#f0e8d8');r(14,22,4,1,'#b8484a')}
  else if(o.mouth==='flat'){r(13,21,6,1,'#5a2a24')}
  else{r(13,21,6,1,'#5a2a24');r(12,20,1,1,'#5a2a24');r(19,20,1,1,'#5a2a24')}
}

function faceCanvas(name,size){const c=document.createElement('canvas');c.width=c.height=32;c.className='pxl';c.style.width=c.style.height=(size||64)+'px';drawFace(c.getContext('2d'),FACES[name]);return c}

/* ---- donut-shop back room, 170 x 221 game px at 2x ---- */
function drawBackRoom(c){
  const r=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  r(0,0,170,221,'#2a2030');
  for(let x=0;x<170;x+=12)r(x,0,1,150,'#241a2a');
  r(0,112,170,3,'#3a2c3c');r(0,115,170,35,'#221a28');for(let x=4;x<170;x+=10)r(x,115,1,35,'#1c1622');
  r(0,150,170,71,'#1b1f33');for(let y=156;y<221;y+=8)r(0,y,170,1,'#161a2c');for(let y=152,i=0;y<221;y+=8,i++)r((i*23)%60,y,1,8,'#161a2c');
  // flickering fluorescent tube and its pool of light
  c.fillStyle='rgba(220,240,230,.06)';c.beginPath();c.moveTo(60,70);c.lineTo(130,70);c.lineTo(160,150);c.lineTo(30,150);c.fill();
  // door with a little lit window
  r(10,62,30,88,'#3a2a34');r(11,63,28,86,'#45333e');r(16,70,18,14,'#d9772b');r(17,71,16,12,'#e8a050');r(24,71,1,12,'#45333e');r(34,108,3,3,'#c0c0c8');
  r(12,92,26,7,'#e8dcc0');for(let x=14;x<36;x+=3)r(x,94,2,3,'#2a2030');
  // corkboard with a scarecrow photo
  r(98,58,64,44,'#5a3a1c');r(100,60,60,40,'#9a6a3a');for(let i=0;i<40;i++)r(100+(i*37)%60,60+(i*17)%40,1,1,'#84582e');
  r(106,64,14,18,'#e8dcc0');r(107,65,12,14,'#1b1f33');r(110,66,6,3,'#6e4630');r(109,69,8,1,'#6e4630');r(111,70,4,4,'#d6a43a');r(112,71,1,1,'#1b1f33');r(114,71,1,1,'#1b1f33');r(108,75,10,1,'#8a6a3a');r(112,74,2,5,'#6e4a2a');r(112,63,2,2,'#b5532e');
  r(126,66,18,12,'#d8cdb4');for(let y=68;y<77;y+=2)r(128,y,13,1,'#8a8070');r(134,64,2,2,'#b5532e');
  r(146,72,10,14,'#e8dcc0');r(148,74,6,6,'#7a6a8a');r(150,71,2,2,'#b5532e');
  r(108,86,22,10,'#d6a43a');r(110,88,16,1,'#6e4a2a');r(110,91,12,1,'#6e4a2a');r(118,84,2,2,'#b5532e');
  c.strokeStyle='#b5532e';c.lineWidth=1;c.beginPath();c.moveTo(113.5,64);c.lineTo(135,65);c.lineTo(151,72);c.moveTo(135,65);c.lineTo(119,85);c.stroke();
  // desk
  r(36,128,124,6,'#7a5234');r(36,128,124,1,'#9a6c44');r(38,134,120,22,'#5a3a24');r(38,134,120,1,'#3e2818');r(42,138,30,14,'#4e3220');r(120,138,34,14,'#4e3220');r(56,144,4,2,'#c0a070');r(135,144,4,2,'#c0a070');
  // cruller box, mug, case folder
  r(104,118,34,10,'#e8dcc0');r(104,118,34,2,'#ff9ec8');r(103,116,36,2,'#d8c8b0');
  [[108,121],[117,121],[126,121]].forEach(([x,y])=>{r(x,y,7,4,'#d9772b');r(x+1,y,5,1,'#f0a860');r(x+3,y+1,1,2,'#8a4a1c')});
  r(84,119,7,9,'#d8cdb4');r(91,121,2,4,'#d8cdb4');r(85,119,5,1,'#3a2418');
  r(52,123,24,5,'#c0a46a');r(54,122,10,1,'#c0a46a');r(60,124,10,1,'#b5532e');
  // tube itself
  r(62,6,46,3,'#e8f0e0');r(60,5,2,5,'#8a8a94');r(108,5,2,5,'#8a8a94');r(62,9,46,1,'#a0b0a8');
}

/* ---- tiny pixel pin, used on case-only item rows ---- */
const PIN='<svg class="pin" viewBox="0 0 7 9" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="0" width="5" height="4" fill="#b5532e"/><rect x="2" y="1" width="2" height="1" fill="#e07a50"/><rect x="0" y="4" width="7" height="1" fill="#7a3520"/><rect x="3" y="5" width="1" height="4" fill="#c0c0c8"/></svg>';

/* ---- shell ---- */
function shell(id){
  const p=document.getElementById(id);
  p.innerHTML=`<div class="topbar"></div><div class="bezel"></div><div class="scr"></div>
  <div class="brand"><i></i>BLACK LANTERN</div>
  <div class="dpad"><b></b><span>▲</span><b></b><span>◀</span><span></span><span>▶</span><b></b><span>▼</span><b></b></div>
  <div class="btn b">B</div><div class="btn a">A</div>
  <div class="pills"><span class="lr">L</span><span>SELECT</span><span>START</span><span class="lr">R</span></div>`;
  return p.querySelector('.scr');
}

/* 1 · Debrief */
(()=>{const s=shell('p1');
  const bg=document.createElement('canvas');bg.width=170;bg.height=221;bg.className='pxl';bg.style.width='340px';bg.style.height='442px';bg.style.position='absolute';bg.style.inset='0';drawBackRoom(bg.getContext('2d'));s.append(bg);
  const w=document.createElement('div');w.className='wrapup';
  w.innerHTML=`<div class="top"><span class="t">CASE CLOSED</span><span class="s">Still Harvest</span></div>
  <div class="stats"><span>Clues <b>4/5</b></span><span>Saved <b>2/3</b></span><span>Fights <b>3</b></span><span>Overstep <b>Chief</b></span></div>
  <div class="sanrow"><div>RAINE<b>−7</b></div><div>DALE<b>−4</b></div><div>MARISOL<b>−9</b></div></div>`;
  s.append(w);
  BLD.render(s,{name:'Big Hat',portrait:(c,m)=>drawBigHat(c,false,m),mouth:1,text:'Four clues outta five. Seen worse bows on uglier packages. Sit.',more:true});
})();

/* 2 · Bag or hide */
(()=>{const s=shell('p2');s.classList.add('pad');
  const items=[
    ['Gleaner\'s sickle','Unnatural','bag',false],
    ['Burlap mask','Unnatural','hide',true],
    ['Fair ribbon','Ordinary','keep',false],
    ['Deputy\'s flask','Ordinary','keep',false]];
  s.insertAdjacentHTML('beforeend',`<div class="hdr"><span class="t">CASE ITEMS</span><span class="s">Big Hat sorts</span></div>`);
  items.forEach(([n,k,a,on])=>s.insertAdjacentHTML('beforeend',`<div class="row${on?' on':''}"><span class="cur">${on?'▶':''}</span>${PIN}<div class="main"><span class="n">${n}</span><span class="sub ${k==='Unnatural'?'unn':''}">${k}</span></div><span class="chip ${a}">${a.toUpperCase()}</span></div>`));
  s.insertAdjacentHTML('beforeend',`<div class="detail"><span>Burlap mask. Warm inside, like someone just took it off.</span><span class="help">Unnatural: bagged as evidence unless hidden.</span></div>`);
  BLD.render(s,{narrate:true,text:'Hide the burlap mask from Big Hat? Can\'t be undone.',choices:['Hide it','Bag it'],sel:0});
})();

/* 4 · Case gains */
(()=>{const s=shell('p4');s.classList.add('pad');
  s.insertAdjacentHTML('beforeend',`<div class="hdr"><span class="t">CASE GAINS</span><span class="s">Failed it, learned it</span></div>`);
  const data=[
    ['RAINE','Shooter',[['Search',45,3],['Persuade',20,1]],null],
    ['DALE','Medic',[['Firearms',32,4]],null],
    ['MARISOL','Investigator',[['Forensics',73,3],['Athletics',40,2]],'NEW: RECONSTRUCT']];
  data.forEach(([n,prof,gains,unl])=>{
    const a=document.createElement('div');a.className='agent';a.append(faceCanvas(n,64));
    a.insertAdjacentHTML('beforeend',`<div class="info"><span class="nm">${n}<small>${prof}</small></span>${gains.map(([k,v,d])=>`<span class="gain"><span class="sk">${k}</span><span class="die">d4·${d}</span><span>${v} → <span class="up">${v+d}</span></span></span>`).join('')}${unl?`<span class="unlock">★ ${unl}</span>`:''}</div>`);
    s.append(a)});
  s.insertAdjacentHTML('beforeend',`<div class="detail"><span>Patched up: HP, WP and statuses reset.</span><span class="help">Next: home scenes. A: continue</span></div>`);
})();
