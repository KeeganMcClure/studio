<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Black Lantern Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: a handheld console shell — a scrolling CRT screen, then D-pad / L-R over Select-Start / A-B. Single dark look by choice. */
:root{
  --shell:#3a2e78; --shell-hi:#5242a0; --shell-lo:#221a4c; --bezel:#14111f;
  --scr-bg:#0d1322; --scr-fg:#ebe5c8; --scr-dim:#7c86a6; --scr-hi:#ffd166; --scr-red:#ff5d73; --scr-grn:#7fe0a3; --scr-line:#1f2a44;
  --btn:#1c1733; --btn-hi:#2d2650; --btn-a:#c23a5c; --btn-b:#8c2c4a; --label:#b9aee8;
  --px:"Press Start 2P", ui-monospace, Menlo, monospace;
  --vt:"VT323", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#100c22;color:var(--scr-fg);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.wrap{height:100%;display:flex;justify-content:center;box-sizing:border-box;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-block:4px}
.shell{width:100%;max-width:460px;height:100%;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;padding:6px 12px 10px;border-radius:16px 16px 34px 34px;
  background:linear-gradient(170deg,var(--shell-hi),var(--shell) 40%,var(--shell-lo));box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -4px 0 rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.5)}
/* L/R sit in the middle cluster above Select/Start (moved from the top shoulders Nov 21, 2026) */
.mid{display:flex;flex-direction:column;align-items:center;gap:var(--midgap)}
.lr{display:flex;gap:8px}
.sh{width:var(--pill);height:22px;border:0;border-radius:8px 8px 5px 5px;background:var(--btn);color:var(--label);font:8px var(--px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.bezel{flex:1;min-height:0;background:var(--bezel);border-radius:10px 10px 26px 10px;padding:10px 10px 6px;display:flex;flex-direction:column;gap:5px;box-shadow:inset 0 0 0 2px #0a0812}
.brand{display:flex;justify-content:space-between;align-items:center;font:7px var(--px);color:#5d5888;letter-spacing:.08em}
.led{width:7px;height:7px;border-radius:50%;background:#3dff8a;box-shadow:0 0 6px #3dff8a;display:inline-block;margin-right:6px;vertical-align:middle}
.led.off{background:#3a3a48;box-shadow:none}
.screen{flex:1;min-height:0;position:relative;background:var(--scr-bg);border-radius:3px;overflow:hidden;display:flex;flex-direction:column;font:20px/1.05 var(--vt);transition:filter .4s}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 9px 6px;font:8px/1.4 var(--px);color:var(--scr-hi);background:#141c33;border-bottom:2px solid var(--scr-line)}
.hdr #hStep{color:var(--scr-dim)}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
.body.side{flex-direction:row}
.list{flex:1;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 0;scrollbar-width:thin;scrollbar-color:var(--scr-line) transparent}
.pane{flex:none;border-top:2px solid var(--scr-line);padding:7px 10px;color:var(--scr-fg);max-height:42%;overflow-y:auto;background:#0f172b}
.pane:empty{display:none}
.body.side .pane{border-top:0;border-left:2px solid var(--scr-line);max-height:none;width:42%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding-top:12px}
.row{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;cursor:pointer;min-height:26px}
.row .cur{width:12px;flex:none;color:var(--scr-hi);visibility:hidden;font-size:16px}
.row.on{background:#1a2440}
.row.on .cur{visibility:visible;animation:bob .6s steps(2) infinite}
.row .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .val{flex:none;display:flex;align-items:center;gap:4px;color:var(--scr-hi)}
.row .val b{font-weight:normal;color:var(--scr-dim);padding:0 3px;cursor:pointer}
.row.on .val b{color:var(--scr-fg)}
.row.dim .lab{color:var(--scr-dim)}
.row.wrap .lab{white-space:normal;overflow:visible;line-height:.95}
.row.go .lab{color:var(--scr-grn)}
.row.warn .lab{color:var(--scr-red)}
.row.pickd{background:#2a2140}
.row input{flex:1;min-width:0;font:20px var(--vt);color:var(--scr-fg);background:#0a1020;border:1px solid var(--scr-line);border-radius:2px;padding:1px 5px;outline:none;-webkit-user-select:text;user-select:text}
.row input:focus{border-color:var(--scr-hi)}
.tag{font:7px var(--px);color:#0d1322;background:var(--scr-red);padding:2px 3px;margin-left:6px;vertical-align:2px}
.tag.mine{background:var(--scr-grn)}
.pip{color:var(--scr-grn);letter-spacing:-1px}
.static{padding:6px 10px;color:var(--scr-dim)}
.static h3{font:8px/1.5 var(--px);color:var(--scr-hi);margin:4px 0 2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0 8px}
.kv span:nth-child(odd){color:var(--scr-dim)}
.small{font-size:17px;color:var(--scr-dim)}
.hi{color:var(--scr-hi)} .red{color:var(--scr-red)} .grn{color:var(--scr-grn)}
.ftr{padding:5px 9px;font:7px/1.5 var(--px);color:var(--scr-dim);border-top:2px solid var(--scr-line);background:#141c33;min-height:12px}
.ftr.creep{color:var(--scr-red)}
canvas.pix,img.pix{image-rendering:pixelated;image-rendering:crisp-edges;background:#16203a;border:2px solid var(--scr-line);max-width:100%}
.logo{font:13px/1.6 var(--px);color:var(--scr-hi);text-align:center;margin:14px 0 6px;letter-spacing:.06em;text-shadow:2px 2px 0 #6b2d4a}
.logo small{display:block;font-size:7px;color:var(--scr-dim);letter-spacing:.2em;text-shadow:none}
.lantern{display:block;margin:6px auto 4px}
.card{border:2px solid var(--scr-line);margin:4px 8px 8px;padding:8px;background:#0f172b;color:var(--scr-fg)}
.card .top{display:flex;gap:10px;align-items:flex-start}
.card .who{min-width:0}
.card .who .n{font:9px/1.5 var(--px);color:var(--scr-hi);word-break:break-word}
.stamp{display:inline-block;font:7px var(--px);color:var(--scr-red);border:1px solid var(--scr-red);padding:2px 4px;transform:rotate(-4deg);margin-top:4px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;margin-top:6px}
/* Creator screens, matched to the approved creator mockups (Nov 21): cream-edged boxes on slate, gold cursor, 7-step bar. Game screens keep their own colors. */
.screen:not(.gaming){--scr-bg:#1b1f33;--scr-fg:#e8dcc0;--scr-dim:#b9a8e0;--scr-hi:#f4c96a;--scr-line:#5a5070;--gold:#d6a43a;--card:#1f2440;--card-on:#2a2f52;--well:#14172a}
.screen:not(.gaming) .hdr{margin:6px 6px 0;border:2px solid var(--scr-fg);border-radius:3px;background:var(--well);padding:5px 8px;flex-wrap:wrap;row-gap:3px}
.hdr.steps #hTitle{flex:1;display:flex;justify-content:space-between;font-size:9px}
.hdr .lr{color:#9a92c8;font-size:8px}
.sbar{flex-basis:100%;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;padding:0 14px;font:13px/12px var(--vt);text-align:center;color:var(--scr-dim)}
.sbar span{border-top:3px solid var(--scr-line);min-width:0;overflow:hidden}
.sbar .done{border-color:#7fbf6a}.sbar .on{border-color:var(--gold);color:var(--scr-hi)}.sbar .lock{opacity:.4}
.info{display:flex;justify-content:space-between;gap:6px;padding:4px 10px 0;font-size:17px;line-height:1;white-space:nowrap;overflow:hidden}
.info span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pane[hidden],.info[hidden],.sbar[hidden]{display:none!important}
.screen:not(.gaming) .list{margin:5px 6px;padding:3px 0;border:2px solid var(--scr-line);border-radius:3px;background:var(--card)}
.screen:not(.gaming) .list.bare{border:0;background:none;padding:0 0 4px}
.screen:not(.gaming) .pane{margin:0 6px 6px;border:2px solid var(--scr-fg);border-radius:3px;background:var(--well);max-height:36%;padding:5px 8px;line-height:1}
.screen:not(.gaming) .pane>div{margin-bottom:3px}
.screen:not(.gaming) .body.side .pane{margin:5px 6px 6px 0;width:auto;flex:none;padding:8px 4px}
.body.side .row{padding-right:4px;gap:3px}
.body.side .row .val{gap:1px}
.screen:not(.gaming) .row.on{background:var(--card-on);box-shadow:inset 0 0 0 2px var(--gold)}
.screen:not(.gaming) .row input{background:var(--well)}
.fg{color:var(--scr-fg)}
.mt{font:7px var(--px);color:#1b1f33;background:var(--gold);padding:2px 3px}
.row.skill .lab{display:flex;align-items:center;gap:6px;overflow:visible}
.row.skill .sk{width:96px;flex:none;overflow:hidden;text-overflow:ellipsis}
.bar{flex:1;min-width:20px;height:6px;background:#2a2030;border:1px solid #120e18}
.bar i{display:block;height:100%}
.row.skill .num{width:22px;text-align:right;color:var(--scr-fg)}
.row.skill .tg{width:30px}
.row.two{margin:0 0 4px;border:2px solid var(--scr-line);border-radius:3px;background:var(--card);padding:3px 8px 3px 4px}
.row.two.blank{border-style:dashed}
.row.two .lab{white-space:normal;line-height:1}
.tn{display:block;font:8px/1.6 var(--px);color:var(--scr-fg)}
.row.on .tn{color:var(--scr-hi)}
.ts{display:block;font-size:16px;color:var(--scr-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.seat{display:block;margin:0 0 6px;border:2px solid var(--scr-line);border-radius:3px;background:var(--card);padding:5px 6px}
.screen:not(.gaming) .row.seat.on{border-color:var(--gold);box-shadow:none}
.row.seat .cur,.row.seat .val{display:none}
.row.seat .lab{display:block;white-space:normal;overflow:visible}
.seat-top{display:flex;gap:8px;align-items:center}
.seat-top .face{width:64px;height:64px;flex:none;border:2px solid var(--scr-fg);border-radius:2px;background:#2a2030;image-rendering:pixelated;image-rendering:crisp-edges}
.seat-top .face.empty{display:flex;align-items:center;justify-content:center;font:16px var(--px);color:var(--scr-line);border-style:dashed;border-color:var(--scr-line);box-sizing:border-box}
.seat-top .who{flex:1;min-width:0;display:flex;flex-direction:column;font-size:16px;line-height:14px}
.seat-top .n{font:10px/14px var(--px);color:var(--scr-fg)}
.row.seat.on .n{color:var(--scr-hi)}
.seat-top .n.dim{color:var(--scr-dim)}
.seat-top .p{color:var(--scr-dim)}
.opts{display:grid;gap:4px;font-size:16px;text-align:center;margin-top:4px}
.opt{background:var(--well);border:1px solid var(--scr-line);color:var(--scr-dim);padding:1px 0;white-space:nowrap;overflow:hidden}
.opt.state{background:#4a4380;color:var(--scr-fg)}
.row.seat.on .opt.sel{background:var(--gold);border-color:var(--gold);color:#1b1f33}
.row.start{justify-content:center;margin:2px auto 4px;width:120px;background:#b8532c;border:2px solid #f4c96a;border-radius:3px;font:9px var(--px);color:#fff3d6}
.row.start .cur{display:none}
.row.start .lab{text-align:center;flex:none}
.screen:not(.gaming) .row.start.on{background:#d0663a;box-shadow:0 0 0 2px var(--gold)}
.row.start.off{opacity:.45}
.row.chiprow{align-items:flex-start}
.row.chiprow .lab{display:flex;gap:6px;align-items:flex-start;overflow:visible;white-space:normal}
.bn{color:var(--scr-hi);font:8px/18px var(--px);flex:none}
.chips{flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.chip{background:var(--well);border:1px solid var(--scr-line);text-align:center;font-size:16px;color:var(--scr-dim);white-space:nowrap;overflow:hidden}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1b1f33}
.chip.lock:not(.on){opacity:.5}
.row.mot .mk{display:inline-block;width:16px;color:var(--scr-hi)}
.row.mot.picked .lab{color:var(--scr-fg)}
.row.mot:not(.picked) .lab{color:var(--scr-dim)}
.screen:not(.gaming) canvas.face,.card img.face{border:2px solid var(--scr-fg);background:#2a2030}
/* small phones (320 × 480): tighter creator */
@media (max-width:340px),(max-height:500px){
 .screen:not(.gaming) .pane{max-height:28%}
 .row.skill .sk{width:76px}
 .row.skill .val b{padding:0 1px}
 .screen:not(.gaming) #pbig{width:64px!important;height:64px!important}
 .body.side .row .lab{font-size:18px;flex:none}
 .body.side .row .val{flex:1;min-width:0;justify-content:flex-end;overflow:hidden;white-space:nowrap}
 .body.side .row .val b[data-act=left]{display:none}
}
.squad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 8px 8px}
.squad .m{border:2px solid var(--scr-line);padding:5px;text-align:center;font-size:16px;background:#0f172b;min-width:0}
.squad .m .p{color:var(--scr-hi);font-size:15px;overflow-wrap:anywhere}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.18) 2px 3px);mix-blend-mode:multiply}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(60,0,10,.85));opacity:0;transition:opacity .4s}
.toast{position:absolute;left:8px;right:8px;bottom:34px;background:#ffd166;color:#0d1322;font:8px/1.5 var(--px);padding:6px 8px;border:2px solid #0d1322;opacity:0;transform:translateY(6px);transition:all .18s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.screen.glitch .list,.screen.glitch .hdr{animation:jit 2.7s steps(1) infinite}
@keyframes jit{0%,91%,100%{transform:none}92%{transform:translate(2px,-1px)}94%{transform:translate(-3px,1px)}96%{transform:translate(1px,0)}}
@keyframes bob{50%{transform:translateX(2px)}}
.ctrls{flex:none;display:grid;grid-template-columns:auto auto auto;justify-content:space-between;align-items:center;gap:6px;padding:4px 0 0}
.dpad{display:grid;grid-template-columns:repeat(3,var(--pad));grid-template-rows:repeat(3,var(--pad))}
.dpad button{border:0;background:var(--btn);color:var(--label);font:10px var(--px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.45)}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}
.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.dpad .c{grid-area:2/2;background:var(--btn);pointer-events:none;box-shadow:none}
.ab{position:relative;width:calc(var(--ab)*2.15);height:calc(var(--ab)*1.85)}
.ab button{position:absolute;width:var(--ab);height:var(--ab);border-radius:50%;border:0;color:#ffe3ec;font:13px var(--px);box-shadow:inset 0 -4px 0 rgba(0,0,0,.4),0 3px 0 rgba(0,0,0,.35)}
.ab .a{right:0;top:6px;background:var(--btn-a)}
.ab .b{left:0;top:calc(var(--ab)*.82);background:var(--btn-b)}
.ss{display:flex;gap:8px;align-items:flex-start}
.ss>div{width:var(--pill);display:flex;flex-direction:column;align-items:center}
.ss button{width:calc(var(--pill) - 4px);height:14px;border-radius:9px;border:0;background:var(--btn);box-shadow:inset 0 -2px 0 rgba(0,0,0,.45);transform:rotate(-22deg)}
.ss span{display:block;font:6px var(--px);color:var(--label);margin-top:4px;text-align:center}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:active,button.down{filter:brightness(1.35);transform:translateY(1px)}
.ss button:active{transform:rotate(-22deg) translateY(1px)}
button:focus-visible{outline:2px solid var(--scr-hi);outline-offset:2px}
:root{--pad:42px;--ab:54px;--pill:46px;--midgap:16px}
@media (max-height:700px),(max-width:380px){:root{--pad:38px;--ab:48px;--pill:42px;--midgap:12px}.bezel{padding:7px 7px 5px}}
@media (max-height:560px),(max-width:340px){:root{--pad:34px;--ab:42px;--pill:40px;--midgap:9px}.brand{display:none}.sh{height:20px}}
@media (max-height:480px){:root{--pad:30px;--ab:38px;--pill:38px;--midgap:7px}.sh{height:18px}}
@media (prefers-reduced-motion:reduce){.screen.glitch .list,.screen.glitch .hdr,.row.on .cur{animation:none}}
#game{position:absolute;inset:0;display:none;overflow:hidden;background:#05040a}
.screen.gaming #game{display:block}
.screen.gaming .hdr,.screen.gaming .body,.screen.gaming .ftr{display:none}
#gcv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.screen.glitch #gcv{animation:jit 2.7s steps(1) infinite}
.gbox{position:absolute;background:rgba(13,19,34,.94);border:2px solid #ebe5c8;box-shadow:0 0 0 2px #0d1322;border-radius:3px;color:#ebe5c8;font:19px/1.08 var(--vt);padding:5px 8px;box-sizing:border-box}
/* Lantern Bust dialog box (dialog.js). Text keeps its 2 px unit; the portrait is drawn at the map's pixel size (--pu = 64 map px, set by the engine). */
#gdlg{position:absolute;inset:0;pointer-events:none}
#gdlg .bld{pointer-events:auto;cursor:pointer}
#gdlg .bld-t{white-space:pre-line}
#gdlg .bld-bust canvas{width:var(--pu,128px);height:var(--pu,128px)}
#gdlg .bld-tab{left:calc(var(--pu,128px) + var(--u) * 5);max-width:calc(100% - var(--pu,128px) - var(--u) * 7)}
#gdlg .bld.np .bld-tab{left:calc(var(--u) * 3);max-width:calc(100% - var(--u) * 6)}
#gdlg .bld-c{overflow-y:auto;scrollbar-width:none}
#gdlg .bld-c li{cursor:pointer}
#game.battle #gdlg .bld{top:calc(var(--u) * 2);bottom:auto}
#gmenu{right:6px;bottom:6px;min-width:52%;max-width:calc(100% - 12px);max-height:62%;overflow-y:auto;padding:4px 6px}
#gmenu .mt{font:7px/1.6 var(--px);color:var(--scr-hi);margin:0 0 2px 2px}
#gmenu .gi{display:flex;gap:4px;padding:1px 2px;cursor:pointer;white-space:nowrap}
#gmenu .gi .gc{width:12px;color:var(--scr-hi);flex:none}
#gmenu .gi.on{background:#1a2440}
#gmenu .gi.dis{color:#5d6680}
#gmenu .md{font-size:16px;color:var(--scr-dim);border-top:1px solid #2a3554;margin-top:3px;padding-top:2px;white-space:normal}
#ghud{position:absolute;left:4px;right:4px;bottom:4px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
#ghud.shake{animation:jit .25s steps(1)}
.hb{background:rgba(13,19,34,.94);border:2px solid #7c86a6;border-radius:3px;padding:2px 4px;font:16px/1 var(--vt);color:#ebe5c8;min-width:0;overflow:hidden}
.hb.on{border-color:var(--scr-hi);transform:translateY(-3px)}
.hb.ko{opacity:.5;border-color:var(--scr-red)}
.hb .nm{font:6px/1.6 var(--px);color:var(--scr-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb b{font-weight:normal;color:var(--scr-hi)} .hb .red,.gbox .red{color:var(--scr-red)} .hb .sn{color:#b9aee8}
#gsan{left:6px;top:6px;padding:1px 6px;font:7px/1.8 var(--px);border-width:1px}
#gsan b{font-weight:normal;color:var(--scr-hi)}
#game.battle #gsan{display:none}
.gban{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:8px/1.6 var(--px);color:var(--scr-hi);background:rgba(13,19,34,.9);border:1px solid var(--scr-hi);padding:3px 8px;white-space:nowrap}
#gfade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .32s}

</style>

<div class="wrap">
  <div class="shell">
    <div class="bezel">
      <div class="brand"><span><span class="led" id="led"></span>BLACK LANTERN</span><span>DOT MATRIX · INTAKE</span></div>
      <div class="screen" id="screen">
