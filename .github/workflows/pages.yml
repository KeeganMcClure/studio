# Deploys the launcher and every game to GitHub Pages on each push.
# Dev builds come from main; Release builds come from the release branch
# (which only moves when Keegan says to release). See launcher/README.md.
name: Deploy site

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub only lets main deploy to Pages (the github-pages environment's branch rule), so a push to
  # release hands off to a run on main, which builds the whole site, Release builds included.
  hand-off:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start the deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.ref != 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (launcher and Dev builds)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Is there a release yet?
        id: rel
        run: |
          if git -C main ls-remote --exit-code --heads origin release >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check out release (Release builds)
        if: steps.rel.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: release
          path: release
      # Black Lantern's agency cases live in the private KeeganMcClure/black-lantern repo (its bible, Tech → File and
      # code). BL_PRIVATE_TOKEN is a read-only token for that repo, saved as a secret in this repo's settings; it is
      # never written into any file. The game's build stops if these files are missing.
      - name: Check out Black Lantern's private agency files
        uses: actions/checkout@v4
        with:
          repository: KeeganMcClure/black-lantern
          token: ${{ secrets.BL_PRIVATE_TOKEN }}
          path: private/black-lantern
          sparse-checkout: agency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        env:
          BL_PRIVATE_DIR: ${{ github.workspace }}/private/black-lantern/agency
        run: |
          # The build id names both branches, so a release alone also counts as a new build on the phone
          BUILD="$(date -u +%Y-%m-%d)-$(git -C main rev-parse --short HEAD)"
          if [ -d release ]; then REL="--release release"; BUILD="$BUILD-r$(git -C release rev-parse --short HEAD)"; else REL=""; fi
          node main/launcher/tools/build.js --dev main $REL --out _site --build "$BUILD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
