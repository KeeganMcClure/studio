# Deploys the launcher and every game to GitHub Pages on each push.
# Dev builds come from main; Release builds come from the release branch
# (which only moves when Keegan says to release). See launcher/README.md.
name: Deploy site

on:
  push:
    branches: [main, release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (launcher and Dev builds)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Is there a release yet?
        id: rel
        run: |
          if git -C main ls-remote --exit-code --heads origin release >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Check out release (Release builds)
        if: steps.rel.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: release
          path: release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: |
          BUILD="$(date -u +%Y-%m-%d)-$(git -C main rev-parse --short HEAD)"
          if [ -d release ]; then REL="--release release"; else REL=""; fi
          node main/launcher/tools/build.js --dev main $REL --out _site --build "$BUILD"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
